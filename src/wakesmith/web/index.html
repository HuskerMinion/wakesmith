<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/static/favicon.png">
<title>wakesmith</title>
<style>
  /* Brand fonts, bundled (SIL OFL 1.1: /static/FONTS-LICENSE.txt) */
  @font-face { font-family: "Montserrat"; font-weight: 600; font-style: normal; font-display: swap; src: url(/static/montserrat-latin-600-normal.woff2) format("woff2"); }
  @font-face { font-family: "Montserrat"; font-weight: 700; font-style: normal; font-display: swap; src: url(/static/montserrat-latin-700-normal.woff2) format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 400; font-style: normal; font-display: swap; src: url(/static/inter-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 500; font-style: normal; font-display: swap; src: url(/static/inter-latin-500-normal.woff2) format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 600; font-style: normal; font-display: swap; src: url(/static/inter-latin-600-normal.woff2) format("woff2"); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 400; font-style: normal; font-display: swap; src: url(/static/jetbrains-mono-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 500; font-style: normal; font-display: swap; src: url(/static/jetbrains-mono-latin-500-normal.woff2) format("woff2"); }
  /* Brand kit: Deep Space ground, Neon Cyan accents, Forge Orange primary, Waveform Gold levels. */
  :root {
    --bg: #0f141e; --side: #0a0e15; --panel: #1a2536; --raised: #24324a; --inset: #141c2a;
    --line: #2a3b5c; --line2: #223049; --field: #3a4f75;
    --text: #e6ecf5; --muted: #9aa8bd; --soft: #c5cfdd;
    --cyan: #4ad5ff; --orange: #ff7b00; --gold: #ffcc00; --on-accent: #0f141e;
    --ok-bg: #123528; --ok: #5fe0a0; --info-bg: #10304a; --info: #7fdfff; --warn-bg: #3a2410; --warn: #ffb066;
    --pick-bg: #2a2414;
    --bar-caught: #1c95c4; --bar-false: #d96500;  /* chart shades, checked for color blindness on --panel */
    --head: Montserrat, "Segoe UI", system-ui, sans-serif;
    --body: Inter, "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono: "JetBrains Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }  /* .panel's display: flex would otherwise show hidden panels */
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 var(--body); }
  a { color: var(--cyan); } a:hover { color: #8be4ff; }
  .app { min-height: 100vh; display: flex; flex-wrap: wrap; }

  /* sidebar: stacks on top on a phone */
  nav.side { flex: 1 1 240px; max-width: 100%; background: var(--side); border-right: 1px solid #1e2a3d;
             padding: 22px 14px; display: flex; flex-direction: column; gap: 22px; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; padding: 0 8px; }
  .brand img { width: 40px; height: 40px; border-radius: 10px; display: block; }
  .brand span { font: 700 23px/1 var(--head); color: #fff; letter-spacing: -.01em; }
  .brand b { font-weight: 700; background: linear-gradient(90deg, var(--orange), #ffb347 45%, var(--cyan));
             -webkit-background-clip: text; background-clip: text; color: transparent; }
  .navgroup { display: flex; flex-direction: column; gap: 3px; }
  .navgroup + .navgroup { padding-top: 14px; border-top: 1px solid var(--line2); }
  .navlabel { font-size: 12px; font-weight: 600; color: var(--muted); padding: 0 12px 4px; letter-spacing: .04em; text-transform: uppercase;
              overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .navgroup a { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 8px;
                color: #b8c4d6; text-decoration: none; font-size: 15px; }
  .navgroup a:hover { background: #141c2a; color: #fff; }
  .navgroup a[aria-current="page"] { background: var(--panel); color: #fff; font-weight: 600; }
  .navgroup a[aria-current="page"] svg { stroke: var(--cyan); }
  .machine { margin-top: auto; padding: 12px; border-radius: 10px; background: var(--inset); font-size: 13px; color: var(--muted); }
  .machine strong { display: block; color: #fff; margin-bottom: 4px; }
  .machine .warn { color: var(--warn); margin-top: 6px; }

  main { flex: 999 1 560px; min-width: 0; padding: 36px clamp(16px, 4vw, 52px) 64px; display: flex; flex-direction: column; gap: 22px; }
  h1 { font: 700 30px/1.15 var(--head); margin: 0; letter-spacing: -.02em; }
  h2 { font: 700 18px/1.25 var(--head); margin: 0; }
  h3 { font-size: 15px; margin: 0; }
  .kicker { font-size: 14px; color: var(--muted); font-weight: 500; margin-bottom: 4px; }
  .sub { color: var(--muted); margin: 6px 0 0; max-width: 760px; }
  .head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; gap: 14px; }
  .panel.dark { background: var(--raised); border-color: var(--raised); }
  .panel[hidden] { display: none; }  /* display: flex above would otherwise show hidden panels */
  .cols { display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start; }
  .cols > .wide { flex: 999 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 22px; }
  .cols > .narrow { flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
  .hint { color: var(--muted); font-size: 13px; font-weight: 400; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
  .mono { font-family: var(--mono); }

  /* controls */
  label.f { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; }
  input[type=text], input[type=search], input[type=password], input[type=number], select { font: 400 15px var(--body); color: var(--text); background: var(--inset);
         border: 1px solid var(--field); border-radius: 10px; min-height: 46px; padding: 0 12px; width: 100%; }
  input:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .row > .grow { flex: 1 1 260px; }
  button, .btn { font: 500 15px var(--body); border-radius: 10px; min-height: 44px; padding: 0 18px; cursor: pointer;
           border: 1px solid #34486b; background: var(--panel); color: var(--text); display: inline-flex; align-items: center;
           justify-content: center; gap: 8px; text-decoration: none; }
  button:hover, .btn:hover { border-color: var(--cyan); color: var(--text); }
  button.primary, .btn.primary { background: var(--orange); border-color: var(--orange); color: var(--on-accent); font-weight: 600; }
  button.primary:hover, .btn.primary:hover { background: #ff9233; }
  button.danger { color: var(--warn); }
  button:disabled { opacity: .45; cursor: default; }
  button svg, .btn svg { flex: none; }

  /* badges and notes: always an icon or word with the color */
  .badge { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; }
  .badge.ok { background: var(--ok-bg); color: var(--ok); } .badge.info { background: var(--info-bg); color: var(--info); }
  .badge.warn { background: var(--warn-bg); color: var(--warn); } .badge.idle { background: var(--raised); color: var(--soft); }
  .callout { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 1.5; border-radius: 10px; padding: 12px 14px; }
  .callout.info { background: var(--info-bg); color: #d7f3ff; } .callout.warn { background: var(--warn-bg); color: #ffd9b3; }
  .callout svg { flex: none; margin-top: 2px; }
  .err { color: var(--warn); font-size: 14px; }
  .err:empty { display: none; }

  /* dashboard */
  .filters { display: flex; flex-wrap: wrap; gap: 8px; }
  .filters button { min-height: 40px; border-radius: 999px; padding: 0 16px; font-size: 14px; }
  .filters button[aria-pressed="true"] { background: var(--cyan); border-color: var(--cyan); color: var(--on-accent); font-weight: 600; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .card h2 { font-size: 21px; }
  .stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .stat { background: var(--inset); border-radius: 10px; padding: 10px 12px; }
  .stat .k { font-size: 12px; color: var(--muted); font-weight: 500; }
  .stat .v { font: 500 19px var(--mono); margin-top: 2px; }
  .card .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; }
  .newcard { min-height: 240px; border: 2px dashed #34486b; border-radius: 14px; display: flex; flex-direction: column; align-items: center;
             justify-content: center; gap: 10px; color: var(--muted); text-decoration: none; font-weight: 500; }
  .newcard:hover { border-color: var(--orange); color: var(--text); }
  /* wake words table: one row per word, its versions folded underneath */
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .runstrip { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; padding: 10px 16px; border-radius: 12px; background: var(--info-bg); }
  .runstrip .lead { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; color: var(--info); }
  .runstrip .q { margin-left: auto; }
  .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
  .tools .find { margin-left: auto; width: min(240px, 100%); }
  .wwbox { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); }
  .wwt { min-width: 980px; }
  .wwr { display: grid; grid-template-columns: minmax(240px, 2.2fr) 150px minmax(140px, 1.2fr) 120px 120px 80px 48px; align-items: center; column-gap: 16px; padding: 10px 16px; border-bottom: 1px solid var(--line2); }
  .wwr.hdr { color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 12px 16px; border-bottom-color: var(--line); }
  .wwr.word { min-height: 52px; } .wwr.word:hover { background: #1f2c41; }
  .wwr.ver { background: #172133; font-size: 13.5px; padding-top: 7px; padding-bottom: 7px; } .wwr.ver:hover { background: #1b273c; }
  .wwr .name { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .wwr .name a { color: var(--text); text-decoration: none; } .wwr .name a:hover { text-decoration: underline; }
  .wwr.word .name a { font-family: var(--head); font-weight: 600; font-size: 16px; }
  .wwr.ver .name { padding-left: 42px; }
  .wwr .note { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wwr .num { font-family: var(--mono); } .wwr .num small { font-family: var(--body); color: var(--muted); font-size: 12px; }
  .wwr .cut { color: var(--muted); }
  details.learns > summary { cursor: pointer; list-style: none; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
  details.learns > summary::-webkit-details-marker { display: none; } details.learns > summary::before { content: "▸"; color: var(--muted); } details.learns[open] > summary::before { content: "▾"; }
  details.learns > div { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
  .lsrc { display: flex; flex-direction: column; gap: 6px; } .lgroup { padding: 8px 12px; border-radius: 10px; background: var(--inset); }
  .lgroup .takes { margin-top: 8px; }
  .nextrow { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 6px 16px 10px 58px; border-bottom: 1px solid var(--line2); color: var(--info); font-size: 13.5px; }
  .nextrow .btn, .nextrow button { min-height: 36px; padding: 0 14px; font-size: 13.5px; }
  .fold { width: 32px; height: 32px; min-height: 32px; padding: 0; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 8px; background: transparent; color: var(--soft); flex: 0 0 auto; }
  .fold svg { transition: transform .15s; } .fold[aria-expanded="true"] svg { transform: rotate(90deg); }
  .fold:disabled { visibility: hidden; }
  details.menu { position: relative; } details.menu > summary { list-style: none; width: 38px; height: 38px; display: inline-flex; align-items: center; justify-content: center; border-radius: 10px; cursor: pointer; color: var(--soft); }
  details.menu > summary::-webkit-details-marker { display: none; } details.menu > summary:hover { background: var(--raised); }
  details.menu > div { position: absolute; right: 0; top: 42px; z-index: 5; min-width: 200px; padding: 6px; border-radius: 12px; background: var(--raised); border: 1px solid var(--field); box-shadow: 0 8px 24px #0008; display: flex; flex-direction: column; }
  details.menu > div a, details.menu > div button { display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 12px; border-radius: 8px; background: transparent; border: 0; color: var(--text); text-decoration: none; font: inherit; text-align: left; }
  details.menu > div a:hover, details.menu > div button:hover { background: var(--panel); }
  details.menu > div .danger { color: var(--warn); }
  @media (max-width: 760px) {
    .wwbox { border: 0; background: transparent; overflow: visible; } .wwt { min-width: 0; }
    .wwr.hdr { display: none; }
    .wwr { grid-template-columns: 1fr auto; row-gap: 4px; background: var(--panel); }
    .wwr .c-live, .wwr .c-caught, .wwr .c-false, .wwr .c-last { grid-column: 1 / -1; font-size: 13px; }
    .wwr .c-live:empty, .wwr .c-last { display: none; }
    .wwr .c-caught::before { content: "Caught "; color: var(--muted); font-family: var(--body); }
    .wwr .c-false::before { content: "False "; color: var(--muted); font-family: var(--body); }
    .wwr .c-act { grid-row: 1; grid-column: 2; } .wwr .c-status { grid-column: 1 / -1; }
    .wwr.ver .name { padding-left: 12px; }
    .tools .find { margin-left: 0; width: 100%; }
  }

  /* new wake word */
  .steps { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
  .steps li { display: flex; align-items: center; gap: 8px; padding: 7px 14px 7px 7px; border-radius: 999px; background: var(--panel);
              border: 1px solid var(--line); font-size: 14px; color: var(--muted); }
  .steps li span { display: inline-flex; width: 24px; height: 24px; border-radius: 50%; background: var(--inset); align-items: center;
                   justify-content: center; font-size: 12px; color: var(--text); }
  .steps li a { display: flex; align-items: center; gap: 8px; color: inherit; text-decoration: none; min-height: 30px; }
  .steps li a:hover { text-decoration: underline; }
  .steps li.on { background: var(--raised); border-color: var(--raised); color: #fff; font-weight: 600; }
  .steps li.on span { background: var(--orange); color: var(--on-accent); }
  .steps li.done span { background: var(--ok-bg); color: var(--ok); }
  .scen { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .scen button { flex-direction: column; align-items: flex-start; justify-content: flex-start; text-align: left; gap: 8px; min-height: 164px; padding: 18px; border-radius: 14px;
                 border: 2px solid var(--line); background: var(--panel); }
  .scen button[aria-pressed="true"] { border-color: var(--orange); background: var(--pick-bg); }
  .scen .ic { display: inline-flex; width: 44px; height: 44px; border-radius: 12px; align-items: center; justify-content: center; background: var(--raised); }
  .scen button[aria-pressed="true"] .ic { background: var(--orange); color: var(--on-accent); }
  .scen b { font: 700 17px var(--head); }
  .scen small { font-size: 13px; line-height: 1.45; color: var(--muted); }
  .checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .checks li { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 1.45; }
  .checks .dot { flex: none; display: inline-flex; width: 22px; height: 22px; border-radius: 50%; align-items: center; justify-content: center; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { display: inline-flex; align-items: center; padding-left: 12px; border-radius: 999px; background: var(--inset); border: 1px solid var(--line); font-size: 14px; }
  .chip a { color: var(--text); text-decoration: none; }
  .chip button { border: 0; background: transparent; min-height: 36px; width: 36px; padding: 0; border-radius: 999px; color: var(--muted); }
  .chip button:hover { color: var(--text); }
  .summary { background: var(--raised); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; gap: 14px; }
  dl.kv { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 9px 16px; font-size: 14px; }
  dl.kv dt { color: var(--muted); } dl.kv dd { margin: 0; font-weight: 500; }
  details.adv { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 0 22px; }
  details.adv summary { min-height: 54px; display: flex; align-items: center; font-weight: 600; cursor: pointer; }
  details.adv > div { padding-bottom: 22px; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .radio { display: flex; gap: 10px; flex-wrap: wrap; }
  .radio label { flex: 1 1 200px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; display: flex; gap: 10px; align-items: flex-start; }
  .radio label:has(input:checked) { border-color: var(--orange); background: var(--pick-bg); }
  .radio input { accent-color: var(--orange); margin-top: 4px; }
  .radio b { display: block; }

  /* real voices: tabs, recorder, takes */
  .seg { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; background: var(--inset); border-radius: 12px; align-self: flex-start; }
  .seg button { border: 0; background: transparent; min-height: 44px; }
  .seg button[aria-selected="true"] { background: var(--line); color: #fff; font-weight: 600; }
  button.mic { flex: none; width: 120px; height: 120px; border-radius: 50%; border: 0; background: var(--cyan); color: var(--on-accent); padding: 0; }
  button.mic.on { background: var(--orange); box-shadow: 0 0 0 12px rgba(255,123,0,.25); }
  button.mic:hover { border: 0; filter: brightness(1.08); }
  .meter { display: flex; align-items: flex-end; gap: 3px; height: 40px; }
  .meter span { width: 8px; height: 4px; border-radius: 2px; background: #34405a; transition: height .06s; }
  ul.takes { list-style: none; margin: 0; padding: 0; }
  ul.takes li { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line2); font-size: 14px; }
  ul.takes li:first-child { border-top: 0; }
  button.round { width: 44px; min-height: 44px; padding: 0; border-radius: 50%; }
  button.round.flat { border: 0; border-radius: 10px; background: transparent; color: var(--muted); }
  .tag { padding: 4px 12px; min-height: 32px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--raised); color: var(--soft); border: 0; display: inline-flex; align-items: center; }
  button.tag.test { background: var(--info-bg); color: var(--info); }

  /* training */
  .overall { background: var(--raised); border-radius: 14px; padding: 22px; display: flex; flex-wrap: wrap; gap: 22px; align-items: center; }
  .overall .big { font: 500 26px var(--mono); color: #fff; }
  .bar { height: 10px; background: #34405a; border-radius: 999px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--orange); width: 0; transition: width .4s; border-radius: 999px; }
  .bar.sm { height: 6px; background: var(--info-bg); } .bar.sm > div { background: var(--cyan); }
  ol.stages { list-style: none; margin: 0; padding: 0; }
  ol.stages li { display: flex; gap: 14px; padding: 13px 0; border-top: 1px solid var(--line2); align-items: flex-start; }
  ol.stages li:first-child { border-top: 0; }
  .sdot { flex: none; display: inline-flex; width: 28px; height: 28px; border-radius: 50%; align-items: center; justify-content: center; background: var(--inset); color: var(--muted); }
  .done .sdot { background: var(--raised); color: var(--text); } .running .sdot { background: var(--cyan); color: var(--on-accent); }
  .failed .sdot { background: var(--warn-bg); color: var(--warn); }
  .sbody { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .sline { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; }
  .sline b { font-size: 15px; } .sline span { font: 13px var(--mono); color: var(--muted); }
  .failed .sline span { color: var(--warn); } .off { opacity: .55; }
  pre.log { background: var(--side); border: 1px solid var(--line2); border-radius: 9px; padding: 12px; font: 12px/1.6 var(--mono);
            max-height: 320px; overflow: auto; white-space: pre-wrap; margin: 0; color: #d0d8e4; }

  /* results */
  .tablebox { overflow-x: auto; }
  ul.jobq { list-style: none; margin: 0; padding: 0; }
  ul.jobq li { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 8px 0; border-top: 1px solid var(--line2); font-size: 14px; }
  ul.jobq .acts { margin-left: auto; display: flex; gap: 2px; }
  .toasts { position: fixed; right: 18px; bottom: 18px; z-index: 20; display: flex; flex-direction: column; gap: 10px; width: min(440px, calc(100vw - 36px)); }
  .toast { background: var(--raised); border: 1px solid var(--line); border-left: 4px solid var(--ok); border-radius: 12px; padding: 10px 6px 10px 14px;
           display: flex; gap: 10px; align-items: flex-start; font-size: 14px; box-shadow: 0 8px 28px rgba(0,0,0,.45); }
  .toast.failed { border-left-color: var(--warn); } .toast.stopped { border-left-color: var(--muted); }
  .toast a { color: #fff; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 14px; }
  th { text-align: left; color: var(--muted); font-size: 12px; font-weight: 600; padding: 8px 10px; }
  td { padding: 10px; border-top: 1px solid var(--line2); }
  tr[data-t] { cursor: pointer; } tr[data-t]:hover td { background: #1f2c42; }
  tr.pick td { background: var(--pick-bg); } tr.pick td:first-child { box-shadow: inset 2px 0 0 var(--orange); }
  .hbar { display: flex; align-items: center; gap: 10px; }
  .hbar .track { flex: 1; min-width: 80px; height: 12px; background: var(--inset); border-radius: 4px; overflow: hidden; }
  .hbar .track div { height: 100%; border-radius: 0 4px 4px 0; }
  .files a { display: block; font-size: 14px; } .files a.btn { display: flex; justify-content: flex-start; }

  /* confirm dialog and danger zone */
  dialog.ask { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 14px; padding: 24px; max-width: min(480px, calc(100vw - 32px)); }
  dialog.ask::backdrop { background: rgba(5, 8, 14, .7); }
  dialog.ask h2 { margin-bottom: 10px; } dialog.ask p { margin: 0 0 18px; color: var(--soft); font-size: 14px; line-height: 1.55; }
  dialog.ask .row { justify-content: flex-end; }
  button.bad { background: var(--warn); border-color: var(--warn); color: var(--on-accent); font-weight: 600; }
  button.bad:hover { background: #ffc48a; }
  .danger-zone { border-color: #5a3a1a; }

  /* help */
  .gs { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
  .gs li { background: var(--inset); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--soft); }
  .gs li b { color: var(--text); font-size: 15px; } .gs li span:first-child { font: 13px var(--mono); color: var(--cyan); }
  details.qa { border-top: 1px solid var(--line2); }
  details.qa summary { min-height: 48px; display: flex; align-items: center; cursor: pointer; font-weight: 600; }

  /* AI assistant answers */
  .aians { white-space: pre-wrap; background: var(--inset); border-radius: 10px; padding: 14px 16px; font-size: 14px; line-height: 1.6; color: var(--soft); }
  .aians b { color: var(--text); }
  .vendor { padding: 3px 12px; border-radius: 999px; border: 1px solid; font-weight: 600; font-size: 13px; }
  /* record a room */
  fieldset.rchk { border: 0; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 4px 18px; }
  fieldset.rchk legend { font-size: 14px; font-weight: 600; padding: 0 0 6px; }
  fieldset.rchk label { display: flex; gap: 10px; align-items: center; min-height: 44px; cursor: pointer; }
  fieldset.rchk input { width: 20px; height: 20px; accent-color: var(--orange); }
  .rscript ol { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px; font-size: 16px; }

<body>
<div class="app">
  <nav class="side" aria-label="Main">
    <a class="brand" href="#/"><img src="/static/wakesmith-w.png" alt="" width="40" height="40"><span>wake<b>smith</b></span></a>

    <div class="machine" id="hw"><strong>This machine</strong>detecting hardware…</div>

</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<dialog class="ask" id="ask" aria-labelledby="ask-t"><h2 id="ask-t"></h2><p id="ask-b"></p>
  <div class="row"><button type="button" id="ask-no">Keep it</button><button type="button" class="bad" id="ask-yes"></button></div></dialog>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const enc = encodeURIComponent;
const STAGE_NAMES = {"generate":"Synthetic speech","real":"Your recordings","commonvoice":"Common Voice","conversational":"Everyday sentences","mww-features":"microWakeWord features",
  "mww-train":"microWakeWord training","oww-features":"openWakeWord features","oww-train":"openWakeWord training","test":"Test","export":"Export"};
const STAGE_HELP = {"generate":"Thousands of synthetic speakers saying the phrase and its sound-alikes.",
  "real":"Your recordings: training takes trimmed, test takes set aside.",
  "commonvoice":"Real volunteer voices: the phrase cut out of Common Voice takes, split by speaker.",
  "conversational":"The AI assistant writes everyday sentences with words of the phrase; synthetic voices say them as not-the-phrase clips.",
  "mww-features":"Room echo and noise mixed in; audio turned into what the model hears.",
  "mww-train":"Learning from the synthetic and real takes.", "oww-features":"Audio turned into openWakeWord's embeddings.",
  "oww-train":"Training the openWakeWord head.", "test":"Scoring your test recordings.", "export":"Writing the model files."};
// stroke icons (24-unit grid), drawn in currentColor
const I = {
  grid: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  mic: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
  pulse: '<path d="M4 12h3l2-6 4 12 2-6h5"/>',
  bars: '<path d="M5 20V10M12 20V4M19 20v-7"/>',
  help: '<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17v.5"/>',
  chip: '<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>',
  doc: '<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h7"/>',
  check: '<path d="M5 12l5 5 9-10"/>', bang: '<path d="M12 7v6M12 17v.5"/>', info: '<path d="M12 11v6M12 7v.5"/>',
  play: '<path d="M7 4l13 8-13 8z" fill="currentColor"/>', x: '<path d="M6 6l12 12M18 6L6 18"/>',
  arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>', down: '<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
  spin: '<path d="M12 3a9 9 0 1 0 9 9"/>', clock: '<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>',
  esp: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2"/>',
  home: '<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/>',
  screen: '<rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/>',
  bolt: '<path d="M13 3L5 14h6l-1 7 8-11h-6z"/>', up: '<path d="M12 19V5M6 11l6-6 6 6"/>', dn: '<path d="M12 5v14M6 13l6 6 6-6"/>',
  chev: '<path d="M9 6l6 6-6 6"/>', more: '<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>',
  bell: '<path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/>', trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>', refresh: '<path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/>',
};
const icon = (n, size = 20, w = 1.75) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;
let es = null, HW = null, AI = null;
// The optional AI assistant's settings (assistant.py); AI.enabled decides whether its buttons show.
async function aiLoad() { try { AI = await api("/api/assistant"); } catch { AI = { enabled: false }; } return AI; }
// A model's answer as HTML: escaped, with the bits of Markdown models like to use (bold, code, headings).
const mdLite = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`\n]+)`/g, '<code class="mono">$1</code>').replace(/^#{1,4} +(.+)$/gm, "<b>$1</b>");
const aiAnswer = (r, extra) => `<div class="aians" aria-live="polite">${mdLite(r.answer)}</div>
  <p class="hint" style="margin:0">From ${esc(r.model || "your model")}. It can be wrong: check it against the numbers and the log.</p>${extra || ""}`;

async function api(path, opts = {}) {
  const r = await fetch(path, {headers: {"Content-Type": "application/json"}, ...opts,
                               body: opts.body ? JSON.stringify(opts.body) : undefined});
  if (!r.ok) { let m = r.statusText; try { m = (await r.json()).detail || m; } catch {} throw new Error(m); }
  return r.headers.get("content-type")?.includes("json") ? r.json() : r;
}

// A confirm dialog: resolves true when the person confirms. Esc or "Keep it" cancels.
function ask(title, body, yes) {
  const d = $("#ask");
  $("#ask-t").textContent = title; $("#ask-b").textContent = body; $("#ask-yes").textContent = yes;
  return new Promise(res => {
    const done = v => { d.close(); res(v); };
    $("#ask-yes").onclick = () => done(true); $("#ask-no").onclick = () => done(false); d.oncancel = e => { e.preventDefault(); done(false); };
    d.showModal(); $("#ask-no").focus();

}
const gb = b => b >= 1e9 ? `${(b / 1e9).toFixed(1)} GB` : `${Math.max(1, Math.round(b / 1e6))} MB`;
// Delete a wake word after saying what goes with it. unfinished: the wizard's "cancel" wording.
async function deleteWakeWord(name, label, unfinished) {
  const base = `/api/projects/${enc(name)}`;
  let info;
  try { info = await api(base + "/size"); } catch (e) { alert(e.message); return false; }
  const takes = info.recorded_takes.pos + info.recorded_takes.neg;
  const body = `This removes ${label}'s folder: generated voices, features${takes ? `, ${takes} take${takes > 1 ? "s" : ""} you recorded here` : ""} and any trained models (${gb(info.bytes)}). Folders of your own recordings that it points to are not touched. This can't be undone.`;
  if (!await ask(unfinished ? `Cancel ${label}?` : `Delete ${label}?`, body, unfinished ? "Cancel and delete" : "Delete wake word")) return false;
  try { await api(base, { method: "DELETE" }); location.hash = "#/"; return true; } catch (e) { alert(e.message); return false; }
}
const unfinished = p => !p.job?.running && !Object.values(p.stages || {}).some(s => s?.status === "done");

// ---- shell: sidebar and machine box ----------------------------------------------------------------
function nav(here, project) {
  const a = (href, ic, label) => `<a href="${href}"${href === here ? ' aria-current="page"' : ""}>${icon(ic)}${esc(label)}</a>`;
  const pg = "";  // a wake word's pages are on its step bar (Real voices, Train, Results)
  $("#nav").innerHTML = `<div class="navgroup">${a("#/", "grid", "Wake words")}${a("#/new", "plus", "New wake word")}${a("#/room", "home", "Record a room")}</div>${pg}
    <div class="navgroup">${a("#/help", "help", "Help")}${a("#/hardware", "chip", "Hardware")}${a("#/data", "doc", "Data & licenses")}</div>`;
}

async function hardware() {
  try {
    HW = await api("/api/hardware");
    const h = HW, gpus = h.gpus.length ? `${h.gpus.length} × ${esc(h.gpus[0].name.replace(/\(R\)/g, ""))}` : "CPU only";
    const warn = [h.problem, h.disk_warning, h.ram_warning].filter(Boolean);
    $("#hw").innerHTML = `<strong>This machine</strong>${gpus}<br>${h.cpus} cores · ${Math.round(h.ram_free_gb)}/${Math.round(h.ram_gb)} GB RAM free<br>${Math.round(h.disk_free_gb)} GB disk free`
      + warn.map(w => `<div class="warn">${icon("bang", 14, 2.5)} ${esc(w)}</div>`).join("");
  } catch { $("#hw").innerHTML = ""; }
}

function route() {
  if (es) { es.close(); es = null; }
  onJobs = null; watchJobs();
  const h = location.hash.slice(1) || "/";
  window.scrollTo(0, 0);
  const m = h.match(/^\/p\/([^/]+)(?:\/(voices|train|results))?$/);
  if (h === "/new") return viewNew();
  if (h === "/help") return viewHelp();
  if (h === "/hardware") return viewHardware();
  if (h === "/data") return viewData();
  if (h === "/room") return viewRoom();
  const room = h.match(/^\/room\/([^/]+)$/);
  if (room) return viewSession(decodeURIComponent(room[1]));
  if (m) return viewProject(decodeURIComponent(m[1]), m[2] || "train");
  return viewHome();
}
window.addEventListener("hashchange", route);

// ---- job queue and finished-job notices --------------------------------------------------------------
// Runs wait in a machine-wide queue and start one after another (the server and each finished job start
// the next one). Every page checks now and then; a run that ended since the last look shows as a notice.
let JOBS = null, onJobs = null;  // latest /api/queue; the open page's redraw for it
const RESULT = { ok: ["ok", "check", "Finished"], failed: ["warn", "bang", "Failed"], stopped: ["idle", "x", "Stopped"] };
const when = t => new Date(t * 1000).toLocaleString([], { weekday: "short", hour: "2-digit", minute: "2-digit" });
function jobTitle(t) {
  const m = /^train (\S+) -> (\S+)$/.exec(t || ""), st = s => STAGE_NAMES[s] || s;
  if (!m) return t ? t[0].toUpperCase() + t.slice(1) : "Job";
  if (m[2] === "export") return m[1] === "generate" ? "Training" : m[1] === "real" ? "Retrain from recordings" : `Training from ${st(m[1])}`;
  return `Training: ${st(m[1])} to ${st(m[2])}`;
}
const runningElsewhere = name => (JOBS?.running || []).find(r => r.project !== name);
function notice(e) {
  const [cls, ic, word] = RESULT[e.result] || RESULT.failed, t = document.createElement("div");
  t.className = `toast ${esc(e.result)}`;
  t.innerHTML = `<span class="badge ${cls}">${icon(ic, 14, 2.5)}${word}</span><div style="flex:1;min-width:0"><b><a href="#/p/${enc(e.project)}/train">${esc(e.label)}</a></b> · ${esc(jobTitle(e.title))}
    <div class="hint">${when(e.finished)}${e.error ? " · " + esc(e.error) : ""}</div></div><button type="button" class="round flat" aria-label="Dismiss" title="Dismiss">${icon("x", 16)}</button>`;
  t.querySelector("button").onclick = () => t.remove();
  $("#toasts").append(t);
  if ("Notification" in window && Notification.permission === "granted" && document.hidden)
    new Notification(`${e.label}: ${word.toLowerCase()}`, { body: jobTitle(e.title) + (e.error ? `: ${e.error}` : ""), icon: "/static/favicon.png", tag: `wakesmith-${e.finished}` });
}
async function watchJobs() {
  try { JOBS = await api("/api/queue"); } catch { return; }
  const h = JOBS.history, last = h.length ? h[h.length - 1].finished : JOBS.now, seen = localStorage.getItem("wakesmith-seen-job");
  if (seen !== null) h.filter(e => e.finished > +seen).slice(-3).forEach(notice);  // first visit: no old news
  localStorage.setItem("wakesmith-seen-job", String(Math.max(last, +seen || 0)));
  onJobs?.(JOBS);
}
setInterval(watchJobs, 10000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) watchJobs(); });
// The queue panel: what runs now, what waits (reorder, remove), and the last runs that ended.
function drawQueue(el, J, always) {
  if (!el || !J) return;
  const { running, queue: q, history: h } = J, open = el.querySelector("details")?.open;
  el.hidden = !always && !running.length && !q.length && !h.length;
  const perm = "Notification" in window && Notification.permission === "default"
    ? `<button type="button" data-notify>${icon("bell", 16)}Tell me when runs finish</button>` : "";
  const li = (badge, e, extra, acts = "") => `<li>${badge}<b>${esc(e.label)}</b><span class="hint">${esc(jobTitle(e.title))} · ${extra}</span>${acts}</li>`;
  const rows = running.map(r => li(`<span class="badge info">${icon("spin", 14, 2.5)}Running</span>`, r, `since ${when(r.started)}`))
    .concat(q.map((x, i) => li(`<span class="badge idle mono">${i + 1}</span>`, x, `queued ${when(x.queued_at)}`,
      `<span class="acts"><button type="button" class="round flat" data-move="${esc(x.id)}" data-to="${i - 1}" aria-label="Move up" title="Move up" ${i ? "" : "disabled"}>${icon("up", 16)}</button>
       <button type="button" class="round flat" data-move="${esc(x.id)}" data-to="${i + 1}" aria-label="Move down" title="Move down" ${i < q.length - 1 ? "" : "disabled"}>${icon("dn", 16)}</button>
       <button type="button" class="round flat" data-remove="${esc(x.id)}" aria-label="Remove from the queue" title="Remove from the queue">${icon("trash", 16)}</button></span>`)));
  const done = h.slice().reverse().map(e => { const [cls, ic, word] = RESULT[e.result] || RESULT.failed;
    return li(`<span class="badge ${cls}">${icon(ic, 14, 2.5)}${word}</span>`, e, `${when(e.finished)}${e.error ? " · " + esc(e.error) : ""}`); });
  el.innerHTML = `<div class="row" style="justify-content:space-between"><h2 id="h-q">Queue</h2>${perm}</div>
    <p class="hint" style="margin:0">Runs start one after another, in this order, also while this page is closed. When one ends or is stopped, the next starts.</p>
    ${rows.length ? `<ul class="jobq">${rows.join("")}</ul>` : `<p class="hint" style="margin:0">Nothing running or waiting.</p>`}
    ${done.length ? `<details${open ? " open" : ""}><summary class="hint">Finished recently (${done.length})</summary><ul class="jobq">${done.join("")}</ul></details>` : ""}`;
  el.onclick = async e => {
    const b = e.target.closest("button");
    if (!b) return;
    try {
      if (b.dataset.notify !== undefined) { await Notification.requestPermission(); drawQueue(el, JOBS, always); return; }
      if (b.dataset.remove) await api(`/api/queue/${enc(b.dataset.remove)}`, { method: "DELETE" });
      else if (b.dataset.move) await api(`/api/queue/${enc(b.dataset.move)}/move`, { method: "POST", body: { to: +b.dataset.to } });
    } catch (x) { alert(x.message); }
    watchJobs();
  };
}

// ---- wake words (dashboard) -------------------------------------------------------------------------
const SET_NAMES = { pos: "Your recordings: the phrase", neg: "Your recordings: not the phrase", dpos: "Device clips: the phrase", dneg: "Device clips: not the phrase", rpos: "Takes recorded here: the phrase", rneg: "Recorded here: not the phrase", cv: "Common Voice speakers", other: "Other clips" };
const MODEL_NAMES = { mww: "microWakeWord", oww: "openWakeWord", "mww-cv": "microWakeWord · Common Voice speakers", "oww-cv": "openWakeWord · Common Voice speakers",
  "mww-combined": "microWakeWord · combined", "mww-combined-cv": "microWakeWord · combined · Common Voice speakers" };
const RESULT_KINDS = ["mww", "mww-combined", "mww-cv", "mww-combined-cv", "oww", "oww-cv"];
function cardState(p) {
  if (p.job.running) return { key: "run", badge: `<span class="badge info">${icon("spin", 14, 2.5)}Training</span>` };
  if (p.failed.length) return { key: "work", badge: `<span class="badge warn">${icon("bang", 14, 2.5)}Stopped</span>` };
  if (Object.keys(p.live || {}).length) return { key: "live", badge: `<span class="badge ok">${icon("check", 14, 2.5)}Live</span>` };
  if (p.done.includes("export") || Object.keys(p.brief || {}).length) return { key: "ready", badge: `<span class="badge idle">Ready</span>` };
  if (p.done.some(s => s.endsWith("-train"))) return { key: "ready", badge: `<span class="badge idle" title="Trained; not tested or exported in wakesmith yet">Trained</span>` };
  return { key: "none", badge: `<span class="badge idle">${icon("clock", 14, 2.25)}Not trained</span>` };
}
const day = t => t ? new Date(t * 1000).toLocaleDateString([], { month: "short", day: "numeric" }) : "—";
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* private mode */ } } };
// Every project of one phrase is a version of one wake word; the word's row shows the version on the
// devices (else the newest), its versions fold out underneath.
function wakeWords(list) {
  const fam = new Map();
  for (const p of list) (fam.get(p.family) || fam.set(p.family, []).get(p.family)).push(p);
  return [...fam.values()].map(vs => {
    vs.sort((a, b) => b.version - a.version || b.created - a.created);
    const live = vs.filter(p => Object.keys(p.live || {}).length), cur = live[0] || vs[0];
    const running = vs.filter(p => p.job.running);
    return { family: cur.family, label: cur.label, vs, cur, live: live.length > 0, running,
      check: vs.reduce((n, p) => n + (p.to_check || 0), 0), last: Math.max(0, ...vs.map(p => p.last || 0)) };
  }).sort((a, b) => b.live - a.live || a.label.localeCompare(b.label));
}
function briefOf(p) { const k = ["mww", "oww"].find(k => p.models[k] && p.brief[k]); return k ? p.brief[k] : null; }
// First run: no wake words yet. Say what wakesmith does, what's missing, and offer a quick first try.
async function firstRun(v) {
  let dl = null; try { dl = await api("/api/assets/download"); } catch {}
  const missing = dl && dl.missing.length;
  v.innerHTML = `<div><h1>Welcome to wakesmith</h1><p class="sub">Train your own wake word for ESPHome / Home Assistant voice devices (microWakeWord) and openWakeWord, from synthetic voices plus real ones, here on this computer.</p></div>
    ${missing ? `<div class="callout warn">${icon("bang", 18, 2)}<span><b>First, the training data:</b> ${dl.missing.length} item${dl.missing.length > 1 ? "s" : ""} (${dl.missing_gb} GB) aren't downloaded yet. <a href="#/data">Download them on Data &amp; licenses</a>; it runs in the background.</span></div>` : ""}
    <section class="panel" aria-labelledby="h-fr"><h2 id="h-fr">How it goes</h2><ol class="gs">
      <li><span>1</span><b>Name the phrase</b>Two to four syllables, like “hey jarvis”. Synthetic voices say it thousands of ways.</li>
      <li><span>2</span><b>Add real voices</b>Record a few takes in the browser, near and far. Optional, and the biggest gain.</li>
      <li><span>3</span><b>Train and pick a cutoff</b>About 8 minutes for a quick test with a GPU. Results say how often it catches the phrase and how often it fires by mistake.</li>
      <li><span>4</span><b>Put it on your device, keep improving</b>Clips your devices save make the next version better.</li></ol></section>

// ---- time estimates -----------------------------------------------------------------------------
const dur = s => s < 60 ? "under a minute" : s < 5400 ? `${Math.round(s / 60)} min` : `${Math.floor(s / 3600)} h ${Math.round(s % 3600 / 60)} min`;
// Remaining seconds for the running stage s (from its own progress once it has some, else the
// machine's measured rate), then the stages still to come in this run.
function timeLeft(d, s, pct) {
  const est = d.estimates || {}, st = d.stages[s] || {};
  const elapsed = Math.max(0, (d.now || Date.now() / 1000) - (st.started || d.now));
  const f = pct == null ? 0 : pct / 100;
  let left = f >= 0.05 ? elapsed * (1 - f) / f : Math.max((est[s] || 0) - elapsed, 0.1 * (est[s] || 0));
  const args = d.job.args || [], to = args.includes("--to") ? args[args.indexOf("--to") + 1] : "export";
  const keys = Object.keys(STAGE_NAMES), later = keys.slice(keys.indexOf(s) + 1, keys.indexOf(to) + 1);
  const rest = later.filter(k => !d.off?.[k]).reduce((a, k) => a + (est[k] || 0), 0);
  const total = left + rest, end = new Date(Date.now() + total * 1000);
  return { stage: left < 60 ? "under a minute left in this step" : `about ${dur(left)} left in this step`, total: dur(total),
           end: end.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) };
}
// Is stage s still to come in the running job? Stages run in order: those after the running one,
// up to the job's --to stage.
function pending(d, s) {
  const keys = Object.keys(STAGE_NAMES), args = d.job.args || [];
  const to = args.includes("--to") ? args[args.indexOf("--to") + 1] : keys[keys.length - 1];
  const run = keys.findIndex(k => d.stages[k]?.status === "running");
  const i = keys.indexOf(s);
  return run >= 0 && i > run && i <= keys.indexOf(to);
}

// ---- recording in the browser: raw mic (no echo cancelling or gain), 16 kHz mono WAV -------------
const PROMPTS = ["close to the device, in your normal voice", "across the room, normal voice", "from the doorway, a bit louder",
  "close, quietly", "across the room, with the TV or music on", "close, quickly", "from the next room, calling out",
  "close, slowly", "facing away from the device", "while something else is going on (kettle, tap, fan)"];
const WORKLET = `class Tap extends AudioWorkletProcessor { process(i) { if (i[0][0]) this.port.postMessage(i[0][0].slice()); return true; } }
registerProcessor("tap", Tap);`;
function wav16(f32) {  // Float32 [-1, 1] at 16 kHz -> WAV bytes
  const b = new ArrayBuffer(44 + f32.length * 2), d = new DataView(b), s = (o, t) => [...t].forEach((c, i) => d.setUint8(o + i, c.charCodeAt(0)));
  s(0, "RIFF"); d.setUint32(4, 36 + f32.length * 2, true); s(8, "WAVEfmt "); d.setUint32(16, 16, true); d.setUint16(20, 1, true); d.setUint16(22, 1, true);
  d.setUint32(24, 16000, true); d.setUint32(28, 32000, true); d.setUint16(32, 2, true); d.setUint16(34, 16, true); s(36, "data"); d.setUint32(40, f32.length * 2, true);
  f32.forEach((x, i) => d.setInt16(44 + i * 2, Math.max(-1, Math.min(1, x)) * 32767, true));
  return new Blob([b], { type: "audio/wav" });
}
async function to16k(chunks, rate) {
  const n = chunks.reduce((a, c) => a + c.length, 0), all = new Float32Array(n);
  let o = 0; for (const c of chunks) { all.set(c, o); o += c.length; }
  if (rate === 16000) return all;
  const off = new OfflineAudioContext(1, Math.ceil(n * 16000 / rate), 16000), buf = off.createBuffer(1, n, rate);
  buf.copyToChannel(all, 0); const src = off.createBufferSource(); src.buffer = buf; src.connect(off.destination); src.start();

}
// One take: starts at once, stops ~1 s after speech ends (or at maxS); fixedS records exactly that long.
// onLevel(rms) feeds the meter. Returns 16 kHz Float32 trimmed to a little before and after the speech.
async function recordTake({ onLevel, maxS = 8, fixedS = 0, signal }) {
  const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 1 } });
  const ctx = new AudioContext(), url = URL.createObjectURL(new Blob([WORKLET], { type: "text/javascript" }));
  try {
    await ctx.audioWorklet.addModule(url);
    const node = new AudioWorkletNode(ctx, "tap"), src = ctx.createMediaStreamSource(stream), rate = ctx.sampleRate;
    src.connect(node);
    const chunks = [], hop = 0.02;
    let got = 0, noise = 0, nsum = 0, nn = 0, peak = 0, peakT = 0, speechStart = -1, lastLoud = -1, acc = [], accN = 0;
    await new Promise((resolve, reject) => {
      signal?.addEventListener("abort", () => resolve());
      node.port.onmessage = e => {
        chunks.push(e.data); got += e.data.length; acc.push(e.data); accN += e.data.length;
        if (accN < rate * hop) return;
        let sq = 0; for (const c of acc) for (const x of c) sq += x * x;
        const rms = Math.sqrt(sq / accN), t = got / rate; acc = []; accN = 0;
        onLevel?.(rms);
        if (fixedS) { if (t >= fixedS) resolve(); return; }
        if (t < 0.3) { nsum += rms; nn++; noise = nsum / nn; return; }  // the room, before anyone speaks
        if (rms > peak) { peak = rms; peakT = t; }
        if (speechStart < 0) noise = 0.98 * noise + 0.02 * Math.min(rms, noise * 1.5);
        // soft voices across a quiet room peak around 0.005-0.01: a low floor, relative to the room
        if (rms > Math.max(0.002, noise * 4)) { if (speechStart < 0) speechStart = t; lastLoud = t; }
        if ((speechStart >= 0 && t - lastLoud > 1.0 && lastLoud - speechStart > 0.15) || t >= maxS) resolve();
      };

    if (!fixedS && speechStart >= 0) a = a.slice(Math.max(0, Math.floor((speechStart - 0.5) * 16000)), Math.ceil((lastLoud + 0.5) * 16000));
    else if (!fixedS && peak > noise * 2.5) {  // too faint for the detector but above the room: keep 3 s around the loudest moment
      faint = true; a = a.slice(Math.max(0, Math.floor((peakT - 1.5) * 16000)), Math.ceil((peakT + 1.5) * 16000));
    }
    return { audio: a, heard: fixedS > 0 || speechStart >= 0 || faint, faint };
  } finally { stream.getTracks().forEach(t => t.stop()); ctx.close(); URL.revokeObjectURL(url); }
}

      if (r.faint) $("#rechint").textContent = "Saved, but it was very faint: press play on the newest take to check you can hear the phrase.";
    } catch (e) { err(e.name === "NotAllowedError" ? "The browser blocked the microphone: allow it for this page and try again." : e.message); }
    finally { busy = false; mic?.classList.remove("on"); }
  };

  const foldersPane = () => `<section class="panel" aria-labelledby="h-f"><h2 id="h-f">Folders of recordings</h2>
      <label class="f" for="pos">Recordings of the phrase <span class="hint">16 kHz WAV; optional labels.csv and HELDOUT.txt</span>

      <div class="row"><button type="button" id="save">Save folders</button><span class="hint" id="saved"></span></div></section>`;
  let cv = null;
  const cvPane = () => {
    if (!cv) return `<section class="panel"><h2>Mozilla Common Voice</h2><p class="hint" style="margin:0">Looking up "${esc(p.phrase)}" in Common Voice…</p></section>`;
    if (cv.error) return `<div class="callout warn">${icon("bang", 18, 2)}<span>${esc(cv.error)}</span></div>`;
    if (cv.language && cv.language !== "en") return `<section class="panel"><h2>Mozilla Common Voice</h2>
      <div class="callout info">${icon("info", 18, 2)}<span>Common Voice here is the English set, so it can't help a word in another language yet. Record real takes on the Your recordings tab instead.</span></div></section>`;
    if (!cv.present) return `<section class="panel"><h2>Mozilla Common Voice</h2>
      <p style="margin:0;color:var(--soft)">Real volunteer voices reading sentences aloud (CC0, free to use). For a phrase made of common words, wakesmith finds the takes that contain it and cuts it out.</p>
      <div class="callout info">${icon("info", 18, 2)}<span>Common Voice isn't on this machine yet. It is about 47 GB: on the machine wakesmith runs on, run <code class="mono">wakesmith commonvoice-download</code>, then come back here. (Looked in <code class="mono">${esc(cv.dataset)}</code>.)</span></div></section>`;
    const few = cv.takes < 50, st = cv.settings;
    return `<section class="panel"><h2>Mozilla Common Voice</h2>
      <div class="row" style="gap:28px"><div><div class="mono" style="font-size:32px">${cv.takes.toLocaleString()}</div><div class="hint">takes with "${esc(p.phrase)}"</div></div>
        <div><div class="mono" style="font-size:32px">${cv.speakers.toLocaleString()}</div><div class="hint">different speakers</div></div>
        <div><div class="mono" style="font-size:32px">CC0</div><div class="hint">free to use, no conditions</div></div></div>
      ${few ? `<div class="callout warn">${icon("bang", 18, 2)}<span>That's too few to tell you much: Common Voice helps most for single common words. Phrases like "hey jarvis" are rarely in it.</span></div>` : ""}
      <label style="display:flex;gap:12px;align-items:flex-start;min-height:44px;cursor:pointer"><input type="checkbox" id="cvon" ${st.enabled ? "checked" : ""} ${cv.takes ? "" : "disabled"} style="width:22px;height:22px;margin:2px 0 0;accent-color:var(--orange)">
        <span><b>Use as a test set</b><br><span class="hint">${Math.round(st.test_share * 100)}% of the speakers are kept aside and never trained on: the honest check on real strangers. Results show as "Common Voice speakers" on Compare.</span></span></label>
      <label style="display:flex;gap:12px;align-items:flex-start;min-height:44px;cursor:pointer"><input type="checkbox" id="cvtrain" ${st.train ? "checked" : ""} ${st.enabled ? "" : "disabled"} style="width:22px;height:22px;margin:2px 0 0;accent-color:var(--orange)">
        <span><b>Also train on the other speakers</b><br><span class="hint">Up to ${st.max_train.toLocaleString()} takes. For "computer" this took real-voice recall from 28% to 76%.</span></span></label>
      <p class="hint" style="margin:0">${cv.extracted ? "The phrase is already cut out of the takes, so training adds a few seconds." : "The next training run cuts the phrase out of the takes: one pass over the audio, about 20 minutes the first time, then it's kept."}
        The alignment model wakesmith uses for cutting (MMS) is CC BY-NC 4.0, like the personal data profile.</p><span class="hint" id="cvsaved"></span></section>`;
  };
  // ---- device clips: what the devices saved, labeled into the next round (rounds.py) ----
  let dev = null, devShow = null, holdFrom = "", sched = null, quick = null;
  const DEVLABEL = { wake: "the phrase", not_wake: "not the phrase", skip: "leave out" };
  const KEYS = { wake: "Y", not_wake: "N", skip: "L" };
  const howTo = () => `<div class="callout info">${icon("help", 18, 2)}<div style="display:flex;flex-direction:column;gap:6px">
      <b>How to label a clip: listen to it. The transcript is only Whisper's guess.</b>
      <span><b>The phrase</b> (Y): a person in the room says “${esc(p.phrase)}” as a call, your own tests included.</span>
      <span><b>Not the phrase</b> (N): “${esc(p.phrase)}” isn't said: TV, music, other talk, a cough, silence. These false alarms teach the model most.</span>
      <span><b>Leave out</b> (L): you can't tell, it's cut off, or the words are said but not as a call (the TV saying it, or someone using the words in a sentence).</span>
      <span class="hint">Clips where Whisper heard none of the phrase's words are labeled “not the phrase” by themselves; only the rest are listed under <b>Listen</b>. Disagree with one? Change it under <b>Not the phrase</b>.</span></div></div>`;
  const loadDev = async () => {
    if (!sched) api("/api/clips-schedule").then(r => { sched = r; if (tab === "dev" && $("#syncbox")) draw(); }).catch(e => { sched = { error: e.message }; });
    try { dev = await api(base + "/devices" + (holdFrom ? `?holdout_from=${enc(holdFrom)}` : "")); } catch (e) { dev = { error: e.message }; }
    if (dev.summary && !holdFrom && dev.summary.last) {  // default: hold out the newest day
      const t = new Date(Date.parse(dev.summary.last) - 864e5); holdFrom = t.toISOString().slice(0, 13) + ":00";
      try { dev = await api(base + "/devices?holdout_from=" + enc(holdFrom)); } catch {}
    }
    if (tab === "dev") draw();
  };
  const devPick = () => ({ todo: x => !x.label, unclear: x => !x.label && x.suggestion !== "not_wake",
    wake: x => x.label === "wake", not_wake: x => x.label === "not_wake", all: () => true })[devShow];
  const devRows = () => {
    const c = dev.clips, pick = devPick();
    const rows = c.filter(pick), shown = rows.slice(-300).reverse();
    return `${shown.map(x => `<li><button type="button" class="round" data-dplay="${esc(x.id)}" aria-label="Play ${esc(x.id)}">${icon("play", 14)}</button>
        <span class="mono hint" style="min-width:150px">${esc(x.device)}<br>${esc(new Date(x.at).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }))}${x.score != null ? ` · ${Number(x.score).toFixed(2)}` : ""}</span>

        ${["wake", "not_wake", "skip"].map(k => `<button type="button" class="tag ${x.label === k ? "test" : ""}" data-dlabel="${k}" data-id="${esc(x.id)}" aria-pressed="${x.label === k}">${DEVLABEL[k]}</button>`).join("")}</li>`).join("")
      || `<li class="hint">Nothing here.</li>`}${rows.length > shown.length ? `<li class="hint">…and ${rows.length - shown.length} older ones.</li>` : ""}`;
  };
  const devPane = () => {
    if (!dev) return `<section class="panel"><h2>Device clips</h2><p class="hint" style="margin:0">Loading…</p></section>`;
    if (dev.error) return `<div class="callout warn">${icon("bang", 18, 2)}<span>${esc(dev.error)}</span></div>`;
    const s = dev.summary, h = s.heldout || { wake: 0, not_wake: 0 };
    devShow ??= s.to_check ? "unclear" : "not_wake";
    const seg = [["unclear", `Listen (${s.to_check})`], ["wake", `Phrase (${s.labels.wake})`], ["not_wake", `Not the phrase (${s.labels.not_wake})`], ["all", "All"]];
    return `${syncPane()}<section class="panel" aria-labelledby="h-dev"><h2 id="h-dev">Device clips</h2>

      <label class="f" for="devdir">Folder of device clips <span class="hint">any layout; a .json next to each clip with "at", "device", "model", "score" is read</span>
        <input type="text" id="devdir" placeholder="/home/you/device-clips/incoming"></label>
      <div class="row"><button type="button" id="devimport">Import new clips</button>
        <button type="button" id="devtx" ${s.total > s.transcribed ? "" : "disabled"}>Transcribe ${s.total - s.transcribed} clips</button>
        ${s.unlabelled > s.to_check ? `<button type="button" id="devaccept">Label the ${s.unlabelled - s.to_check} clear “not the phrase” clips</button>` : ""}<span class="hint" id="devmsg"></span></div>
      <p class="hint" style="margin:0">${s.total} clips${s.first ? `, ${esc(new Date(s.first).toLocaleDateString())} to ${esc(new Date(s.last).toLocaleDateString())}` : ""}; ${s.transcribed} transcribed. Transcribing runs Whisper in the background (the whisper extra). Clips where the transcript has none of the phrase's words are labeled “not the phrase” by themselves; a person listens to the rest.</p></section>
    <section class="panel" aria-labelledby="h-devl"><h2 id="h-devl" class="sr">Label the clips</h2>${howTo()}
      <div class="row" style="justify-content:space-between"><div role="tablist" class="seg" id="devseg">${seg.map(([k, l]) => `<button type="button" role="tab" aria-selected="${devShow === k}" data-dseg="${k}">${l}</button>`).join("")}</div>
        <button type="button" class="primary" id="quickgo" ${dev.clips.filter(devPick()).length ? "" : "disabled"}>${icon("play", 14)}Quick check, one at a time</button></div>
      ${quick ? quickPane() : `<ul class="takes" id="devlist">${devRows()}</ul>`}</section>
    <section class="panel" aria-labelledby="h-devr"><h2 id="h-devr">Use them in training</h2>
      <label class="f" for="holdfrom">Keep aside to test: clips from <span class="hint">a time (UTC); whole newest days test best, since clips of one day share voices and noise</span>
        <input type="text" id="holdfrom" class="mono" value="${esc(holdFrom)}" placeholder="2026-10-23T18:00"></label>
      <p class="hint" style="margin:0">From then on: ${h.wake} of the phrase and ${h.not_wake} not-the-phrase clips are kept aside; ${s.labels.wake - h.wake} and ${s.labels.not_wake - h.not_wake} train.${dev.applied ? ` Last used ${esc(new Date(dev.applied.applied * 1000).toLocaleString())}.` : ""}</p>
      <div class="row"><button type="button" class="primary" id="devapply" ${s.labels.wake + s.labels.not_wake ? "" : "disabled"}>Use the labeled clips</button><span class="hint" id="devapplied"></span></div>
      <p class="hint" style="margin:0">Then <b>Retrain from recordings</b>. Unlabeled and "leave out" clips are never used.</p></section>`;
  };
  // Quick check: one clip at a time, played as it comes up; Y / N / L label it and go on, Space plays
  // it again, Backspace goes back one. The list it walks is fixed when it starts.
  const quickPane = () => {
    const ids = quick.ids, x = dev.clips.find(c => c.id === ids[quick.i]);
    if (!x) return `<div class="callout info">${icon("check", 18, 2)}<span>Done: ${ids.length} clip${ids.length > 1 ? "s" : ""} checked. <button type="button" id="quickend">Back to the list</button></span></div>`;
    const btn = k => `<button type="button" class="${x.label === k ? "primary" : ""}" data-qlabel="${k}" aria-pressed="${x.label === k}" style="min-height:56px;flex:1 1 160px;font-size:16px"><span class="mono" style="opacity:.7">${KEYS[k]}</span> ${DEVLABEL[k][0].toUpperCase() + DEVLABEL[k].slice(1)}</button>`;
    return `<div style="display:flex;flex-direction:column;gap:14px;padding:6px 0" id="quickbox">
      <div class="row" style="justify-content:space-between"><b>Clip ${quick.i + 1} of ${ids.length}</b>
        <span class="hint mono">${esc(x.device)} · ${esc(new Date(x.at).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }))}${x.score != null ? ` · score ${Number(x.score).toFixed(2)}` : ""}</span></div>
      <div style="font-size:18px">${x.text == null ? `<span class="hint">not transcribed</span>` : `Whisper heard: “${esc(x.text)}”`}</div>
      <div class="row"><button type="button" id="qplay">${icon("play", 14)}Play again <span class="mono hint">Space</span></button>
        <button type="button" id="qback" ${quick.i ? "" : "disabled"}>Back <span class="mono hint">⌫</span></button>
        <button type="button" id="qskip">Skip for now <span class="mono hint">→</span></button>
        <button type="button" id="quickend" style="margin-left:auto">Stop</button></div>
      <div class="row" style="gap:10px">${btn("wake")}${btn("not_wake")}${btn("skip")}</div></div>`;
  };
  let quickAudio = null;
  const quickPlay = () => { const id = quick?.ids[quick.i]; if (!id) return; quickAudio?.pause(); quickAudio = new Audio(`${base}/devices/audio?id=${enc(id)}`); quickAudio.play().catch(() => {}); };
  const quickKey = e => {
    // only on the page this quick check started on: leaving it (another wake word, another page) ends it
    if (!quick || location.hash !== quick.hash) { document.removeEventListener("keydown", quickKey); quick = null; quickAudio?.pause(); return; }
    if (!$("#quickbox") || e.target.closest("input, textarea, select")) return;
    const k = { y: "wake", n: "not_wake", l: "skip" }[e.key.toLowerCase()];
    if (k) { e.preventDefault(); quickLabel(k); }
    else if (e.key === " ") { e.preventDefault(); quickPlay(); }
    else if (e.key === "Backspace" && quick.i) { e.preventDefault(); quick.i--; draw(); quickPlay(); }
    else if (e.key === "ArrowRight") { e.preventDefault(); quick.i++; draw(); quickPlay(); }
    else if (e.key === "Escape") quickStop();
  };
  const quickStop = () => { quick = null; quickAudio?.pause(); document.removeEventListener("keydown", quickKey); loadDev(); };
  const quickLabel = async k => {
    const id = quick.ids[quick.i];
    try { await api(base + "/devices/labels", { method: "POST", body: { labels: { [id]: k } } }); } catch (x) { err(x.message); return; }
    const c = dev.clips.find(x => x.id === id); if (c) c.label = k;
    quick.i++; draw(); quickPlay();
  };
  const syncPane = () => {
    const y = dev.sync || {}, l = y.last, sc = sched || {};
    const when = t => new Date(t * 1000).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
    const last = !l ? "Not synced yet." : `Last sync ${esc(when(l.at))}: ${esc(l.text)}.`;
    const daily = sc.error ? `<span class="hint">${esc(sc.error)}</span>` : !sched ? `<span class="hint">checking…</span>`
      : sc.installed ? `On, every day at ${esc(sc.at)} for every wake word with a folder set.${sc.next ? ` Next: ${esc(sc.next)}.` : ""}${sc.last_result && sc.last_result !== "success" ? ` Last run: ${esc(sc.last_result)}.` : ""}` : "Off.";
    return `<section class="panel" aria-labelledby="h-sync" id="syncbox"><h2 id="h-sync">Sync automatically</h2>
      <p style="margin:0;color:var(--soft)">Brings in this word's new clips from the folder your devices' clips arrive in and transcribes them, so you only need to listen to the unclear ones.</p>
      <label class="f" for="syncsrc">Folder your device clips arrive in <span class="hint">read only: clips are copied, nothing there is moved or deleted</span>
        <input type="text" id="syncsrc" value="${esc(y.source || "")}" placeholder="/home/you/device-clips/incoming"></label>
      <label class="f" for="syncpre">Only clips from the model named <span class="hint">the start of "model" in each clip's .json, e.g. hey_jarvis; empty: every clip</span>
        <input type="text" id="syncpre" class="mono" value="${esc(y.model_prefix || "")}" placeholder="hey_jarvis"></label>
      <label class="f" for="syncsince">Only clips from <span class="hint">optional, a time (UTC), e.g. when this model went live</span>
        <input type="text" id="syncsince" class="mono" value="${esc(y.since || "")}" placeholder="2026-10-24T18:00"></label>
      <div class="row"><button type="button" id="syncsave">Save</button><button type="button" id="syncnow" ${y.source ? "" : "disabled"}>Sync now</button><span class="hint" id="syncmsg"></span></div>
      <p class="hint" style="margin:0">${last}</p>
      <div class="row"><label style="display:flex;gap:10px;align-items:center;min-height:44px;cursor:pointer"><input type="checkbox" id="syncday" ${sc.installed ? "checked" : ""} ${sched && !sc.error ? "" : "disabled"} style="width:22px;height:22px;margin:0;accent-color:var(--orange)"><b>Every day at</b></label>
        <input type="text" id="syncat" class="mono" value="${esc(sc.at || "03:30")}" style="width:90px" aria-label="time of day, 24 hour"><span class="hint">${daily}</span></div></section>`;
  };
  const syncWire = () => {
    const msg = t => { const m = $("#syncmsg"); if (m) m.textContent = t; };
    $("#syncsave").onclick = async () => { err(); try { dev.sync = await api(base + "/devices/sync", { method: "PUT", body: { source: $("#syncsrc").value, model_prefix: $("#syncpre").value, since: $("#syncsince").value } }); draw(); msg("saved"); } catch (e) { err(e.message); } };
    $("#syncnow").onclick = async () => { err(); try { await api(base + "/devices/sync", { method: "POST" }); msg("syncing in the background: Training shows the log; come back in a few minutes"); } catch (e) { err(e.message); } };
    const setDaily = async () => { err(); try { sched = await api("/api/clips-schedule", { method: "PUT", body: { on: $("#syncday").checked, at: $("#syncat").value.trim() } }); draw(); } catch (e) { err(e.message); $("#syncday").checked = !!sched?.installed; } };
    $("#syncday").onchange = setDaily;
    $("#syncat").onchange = () => { if ($("#syncday").checked) setDaily(); };
  };
  const devWire = () => {
    syncWire();
    const msg = t => { const m = $("#devmsg"); if (m) m.textContent = t; };
    $("#devimport").onclick = async () => { err(); try { const r = await api(base + "/devices/import", { method: "POST", body: { folder: $("#devdir").value } }); msg(`${r.added} new, ${r.known} already here`); await loadDev(); } catch (e) { err(e.message); } };
    $("#devtx").onclick = async () => { err(); try { await api(base + "/devices/transcribe", { method: "POST" }); msg("transcribing in the background: come back in a few minutes (Training shows the log)"); } catch (e) { err(e.message); } };
    if ($("#devaccept")) $("#devaccept").onclick = async () => { err(); try { const r = await api(base + "/devices/accept", { method: "POST" }); msg(`${r.changed} labeled`); await loadDev(); } catch (e) { err(e.message); } };
    $("#devseg").onclick = e => { const b = e.target.closest("[data-dseg]"); if (b) { if (quick) quickStop(); devShow = b.dataset.dseg; draw(); } };
    $("#quickgo").onclick = () => { quick = { ids: dev.clips.filter(devPick()).reverse().map(x => x.id), i: 0, hash: location.hash };
      window.addEventListener("hashchange", () => { document.removeEventListener("keydown", quickKey); quickAudio?.pause(); quick = null; }, { once: true });
      document.removeEventListener("keydown", quickKey); document.addEventListener("keydown", quickKey); draw(); quickPlay(); };
    if (quick) {
      $("#quickend").onclick = quickStop;
      if ($("#qplay")) { $("#qplay").onclick = quickPlay; $("#qback").onclick = () => { quick.i--; draw(); quickPlay(); };
        $("#qskip").onclick = () => { quick.i++; draw(); quickPlay(); };
        $("#quickbox").onclick = e => { const b = e.target.closest("[data-qlabel]"); if (b) quickLabel(b.dataset.qlabel); }; }
    }
    $("#holdfrom").onchange = async () => { holdFrom = $("#holdfrom").value.trim(); await loadDev(); };
    $("#devapply").onclick = async () => { err(); try { const r = await api(base + "/devices/apply", { method: "POST", body: { holdout_from: $("#holdfrom").value.trim() } });
      $("#devapplied").textContent = Object.entries(r).map(([k, v]) => `${k === "pos" ? "phrase" : "not the phrase"}: ${v.train} train, ${v.heldout} test`).join("; ") || "nothing labeled"; } catch (e) { err(e.message); } };
    if ($("#devlist")) $("#devlist").onclick = async e => {
      const pl = e.target.closest("[data-dplay]"), lb = e.target.closest("[data-dlabel]");
      if (pl) new Audio(`${base}/devices/audio?id=${enc(pl.dataset.dplay)}`).play();
      if (lb) { const cur = lb.getAttribute("aria-pressed") === "true";
        try { await api(base + "/devices/labels", { method: "POST", body: { labels: { [lb.dataset.id]: cur ? null : lb.dataset.dlabel } } });
          const c = dev.clips.find(x => x.id === lb.dataset.id); if (c) c.label = cur ? null : lb.dataset.dlabel; await loadDev(); } catch (x) { err(x.message); } }
    };
  };
  const loadCv = async () => { try { cv = await api(base + "/commonvoice"); } catch (e) { cv = { error: e.message }; } if (tab === "cv") draw(); };
  const saveCv = async () => {
    err();
    try { const r = await api(base, { method: "PUT", body: { commonvoice: { enabled: $("#cvon").checked, train: $("#cvon").checked && $("#cvtrain").checked } } });
      cv.settings = r.commonvoice; p.commonvoice = r.commonvoice; draw(); $("#cvsaved").textContent = "saved: takes effect on the next training run"; }
    catch (e) { err(e.message); }
  };
  const draw = () => {
    tabs(); sofar();
    $("#pane").innerHTML = tab === "rec" ? recPane() : tab === "folders" ? foldersPane() : tab === "dev" ? devPane() : cvPane();
    if (tab === "cv" && !cv) loadCv();
    if (tab === "dev") { if (!dev) loadDev(); else devWire(); }
    if ($("#cvon")) $("#cvon").onchange = saveCv;
    if ($("#cvtrain")) $("#cvtrain").onchange = saveCv;
    if (tab === "rec" && $("#takes")) { drawTakes(); meter(0); }
    if ($("#mic")) $("#mic").onclick = () => take("pos");
    if ($("#room")) $("#room").onclick = () => take("neg");

    if ($("#takes")) $("#takes").onclick = async e => {
      const pl = e.target.closest("[data-play]"), dl = e.target.closest("[data-del]"), hd = e.target.closest("[data-held]"), sp = e.target.closest("[data-spk]");
      try {
        if (pl) new Audio(`${base}/recordings/${pl.dataset.play}`).play();
        if (dl && confirm(`Delete ${dl.dataset.del.split("/")[1]}?`)) { await api(`${base}/recordings/${dl.dataset.del}`, { method: "DELETE" }); await load(); draw(); }
        if (sp) { const v = prompt(`Who is speaking in ${sp.dataset.spk}?`, sp.dataset.cur); if (v !== null) { await api(`${base}/recordings/pos/${sp.dataset.spk}/speaker`, { method: "POST", body: { speaker: v } }); await load(); draw(); } }
        if (hd) { await api(`${base}/recordings/pos/${hd.dataset.held}/heldout`, { method: "POST", body: { held: hd.getAttribute("aria-pressed") !== "true" } }); await load(); draw(); }
      } catch (x) { err(x.message); }
    };
    if ($("#save")) $("#save").onclick = save;
  };
  const save = async () => {
    err();
    try { await api(base, { method: "PUT", body: { positives: $("#pos").value.trim(), negatives_dir: $("#neg").value.trim() } }); $("#saved").textContent = "saved"; await load(); sofar(); return true; }
    catch (e) { err(e.message); return false; }
  };
  const train = async from => {
    if (tab === "folders" && !await save()) return;
    try { await api(base + "/train", { method: "POST", body: { ...(from ? { from } : {}), ...(runningElsewhere(p.name) ? { queue: true } : {}) } }); location.hash = `#/p/${enc(p.name)}/train`; }
    catch (e) { err(e.message); }
  };
  $("#go").onclick = () => train(); if (hasVoices) $("#retrain").onclick = () => train("real");
  try { await load(); draw(); } catch (e) { err(e.message); }
}

// The Training page's note on an archived project: when, how much it freed, and what Train rebuilds first.
function archNote(p) {
  const a = p.archive; if (!a?.archived) return "";
  const day = new Date(a.archived_at * 1000).toLocaleDateString([], { year: "numeric", month: "short", day: "numeric" });
  const re = (a.to_rebuild || []).filter(s => STAGE_NAMES[s]), secs = re.reduce((t, s) => t + (p.estimates?.[s] || 0), 0);
  return `<div class="callout info">${icon("info", 18, 2)}<span><b>Archived on ${day}</b>${a.by === "auto" ? " because it wasn't used for a while" : ""}: ${gb(a.freed_bytes)} of files wakesmith can make again were removed.
    ${re.length ? `Train and Retrain first make them again (${re.map(s => STAGE_NAMES[s]).join(", ")}${secs ? `: ${secs < 60 ? "under a minute" : "about " + dur(secs)}` : ""}), then carry on as usual.` : ""}
    Your recordings, results, exported files and the trained model were kept.${a.clips ? " Its synthetic clips were removed too, so Train makes them again (the slow part)." : ""}</span></div>`;
}

  const renderStages = (stages, d) => {

      const st = stages[s] || {};
      let status = off(s) ? "off" : st.status || "waiting";

      if (!off(s) && d?.job.running && pending(d, s)) { status = "waiting"; t = d.estimates?.[s] ? (d.estimates[s] < 60 ? "<1 min" : "~" + dur(d.estimates[s])) : ""; }
      const mark = status === "done" ? icon("check", 14, 3) : status === "running" ? icon("spin", 14, 2.5) : status === "failed" ? icon("bang", 14, 3) : "";
      const word = { done: "done", running: "running", failed: "stopped", off: "off", waiting: "waiting", archived: "removed to save space" }[status] || status;
      return `<li class="${status}"><span class="sdot">${mark}</span><div class="sbody"><div class="sline"><b>${STAGE_NAMES[s]}</b><span>${word}${t ? " · " + t : ""}</span></div>
        <div class="hint">${status === "failed" && st.error ? `<span style="color:var(--warn)">${esc(st.error)}</span>` : status === "archived" ? "Its files were removed when the project was archived. The next Train or Retrain makes them again first." : STAGE_HELP[s]}</div>
        ${status === "running" ? `<div class="bar sm"><div id="sbar"></div></div>` : ""}</div></li>`;
    }).join("");
  };
  renderStages(p.stages);
  const act = async (path, body) => { $("#err").textContent = ""; try { await api(base + path, { method: "POST", body: body || {} }); } catch (e) { $("#err").textContent = e.message; } };
  // Another wake word is training: these buttons queue the run instead (it starts when that one ends).
  const train = async body => {
