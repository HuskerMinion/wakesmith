# livekit-wakeword 0.3.0 config (Piper VITS TTS backend). Copy, rename, and change the phrase.
# Sizes mirror upstream configs/prod.yaml, the config behind LiveKit's published results.
model_name: hey_jarvis
target_phrases:
  - "hey jarvis"

n_samples: 25000              # per class; upstream suggests 20000+ for production
n_samples_val: 5000
n_background_samples: 2000
n_background_samples_val: 500
tts_batch_size: 100           # 100 fits a 16 GB+ card; lower it on smaller GPUs

# Sound-alikes the model must learn to reject. These add to the adversarial phrases
# livekit-wakeword generates on its own. Worth the effort: list the bare name, near rhymes, and
# anything a real false trigger turned out to be.
custom_negative_phrases:
  - "jarvis"                  # the name without "hey": the most common false trigger
  - "hey jarvie"
  - "hey harvest"
  - "hey jervis"
  - "hey travis"
  - "hey service"
  - "a jar of this"

augmentation:
  rounds: 3                   # noise/reverb variants of every clip
  # livekit-wakeword 0.3.0 reads these from ./data whatever data_dir says, while `setup` downloads
  # into data_dir: keep them pointing at data_dir (train.sh refuses to run if they hold no audio).
  background_paths: ["./work/data/backgrounds"]
  rir_paths: ["./work/data/rirs"]

model:
  model_type: conv_attention  # best accuracy; exports ONNX only. The DNN twin (OWW_TFLITE=1) gives .tflite.
  model_size: medium          # tiny | small | medium | large

steps: 100000
max_negative_weight: 3000
target_fp_per_hour: 0.1

data_dir: ./work/data
output_dir: ./work/output
