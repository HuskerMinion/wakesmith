    try { await api(base + "/train", { method: "POST", body: { ...body, ...(runningElsewhere(p.name) ? { queue: true } : {}) } }); }
    catch (e) {
      if (!/already running/.test(e.message)) { $("#err").textContent = e.message; return; }
      $("#err").innerHTML = `${esc(e.message)}. <button type="button" id="qinstead">Queue this run</button>`;
      $("#qinstead").onclick = () => act("/train", { ...body, queue: true }).then(watchJobs);
      return;
    }
    watchJobs();
  };
  const queueState = () => {
    const o = runningElsewhere(p.name), mine = (JOBS?.queue || []).map((x, i) => ({ ...x, i })).filter(x => x.project === p.name);
    $("#go").textContent = o ? "Queue this run" : "Train";
    $("#retrain").textContent = o ? "Queue retrain" : "Retrain from recordings";
    $("#go").title = o ? `${o.label} is training now: this run starts when it ends` : "";
    $("#queued").innerHTML = mine.map(x => `<div class="callout info">${icon("clock", 18, 2)}<span>${esc(jobTitle(x.title))} is waiting in the queue (number ${x.i + 1}). It starts by itself${o ? ` after ${esc(o.label)}` : ""}; you can close this page.</span></div>`).join("");
  };
  onJobs = J => { if (!$("#go")) return; drawQueue($("#queue"), J); queueState(); };
  if (JOBS) onJobs(JOBS);
  $("#go").onclick = () => train({});
  $("#retrain").onclick = () => train({ from: "real" });
  $("#stop").onclick = () => act("/stop");
  $("#delww").onclick = () => deleteWakeWord(p.name, p.label, unfinished(p));
  if ($("#comb")) $("#comb").onchange = async () => {
    $("#err").textContent = ""; $("#combsaved").textContent = "";
    try { const r = await api(base, { method: "PUT", body: { microwakeword: { combine: $("#comb").checked } } });
      p.microwakeword = r.microwakeword; $("#combsaved").textContent = "Saved: built after microWakeWord training, and exported instead of the kept candidate."; }
    catch (e) { $("#err").textContent = e.message; $("#comb").checked = p.microwakeword.combine; }
  };
  if ($("#hrir")) $("#hrir").onchange = async () => {
    $("#err").textContent = "";
    try { const r = await api(base, { method: "PUT", body: { microwakeword: { house_rirs: $("#hrir").checked } } });
      p.microwakeword = r.microwakeword; $("#hrirsaved").textContent = r.microwakeword.house_rirs ? "Saved: the next Train or Retrain from recordings mixes in the house's claps." : "Saved: standard room echoes only."; }
    catch (e) { $("#err").textContent = e.message; $("#hrir").checked = p.microwakeword.house_rirs; }
  };
  $("#conv").onchange = async () => {
    $("#err").textContent = ""; $("#convsaved").textContent = "";
    try { const r = await api(base, { method: "PUT", body: { conversational: { clips: +$("#conv").value || 0 } } });
      p.conversational = r.conversational; $("#conv").value = r.conversational.clips; renderStages(r.stages);
      $("#convsaved").textContent = "Saved: takes effect on the next training run."; }
    catch (e) { $("#err").textContent = e.message; $("#conv").value = p.conversational?.clips || 0; }
  };

  // why the last job stopped: wakesmith's own checks always, the AI's explanation on request
  let failKey = null;
  const loadFail = async () => {
    let f;
    try { [f] = await Promise.all([api(base + "/failure"), AI ? null : aiLoad()]); } catch { return; }
    const el = $("#fail"); if (!el) return;
    if (!f.stage) { el.innerHTML = ""; return; }
    el.innerHTML = `<section class="panel" aria-labelledby="h-fail"><h2 id="h-fail">Why it stopped</h2>
      <p class="hint" style="margin:0">${esc(STAGE_NAMES[f.stage] || f.stage)} didn't finish.${f.quick.length ? " What wakesmith found in the log:" : ""}</p>
      ${f.quick.map(q => `<div class="callout warn">${icon("bang", 18, 2)}<span><b>${esc(q.title)}.</b> ${esc(q.advice)}${q.evidence ? `<br><span class="mono" style="font-size:12px;opacity:.8;word-break:break-word">${esc(q.evidence)}</span>` : ""}</span></div>`).join("")
        || `<p class="hint" style="margin:0">wakesmith's own checks don't recognize this one: the Log below shows what happened.</p>`}
      ${AI?.enabled ? `<div class="row"><button type="button" id="explain">${icon("help", 16)}Explain this failure</button><span class="hint" id="explmsg"></span></div><div class="err" id="explerr"></div><div id="expl" style="display:flex;flex-direction:column;gap:10px"></div>`
        : `<p class="hint" style="margin:0">For a plain-language explanation from your own AI model, turn on the AI assistant under <a href="#/hardware">Hardware</a>.</p>`}</section>`;
    if ($("#explain")) $("#explain").onclick = async () => {
      const b = $("#explain"); b.disabled = true; $("#explerr").textContent = "";
      $("#explmsg").textContent = "asking your model: this can take a minute…";
      try {
        const r = await api(base + "/explain", { method: "POST" });
        $("#expl").innerHTML = aiAnswer(r, `<details class="qa"><summary>What was sent</summary><pre class="log">${esc(r.sent)}</pre></details>`);
        $("#explmsg").textContent = "";
      } catch (e) { $("#explerr").textContent = e.message; $("#explmsg").textContent = ""; }
      finally { b.disabled = false; }
    };
  };

  let wasRunning = p.job.running;
  es = new EventSource(base + "/events");
  es.onmessage = ev => {
    const d = JSON.parse(ev.data), log = $("#log");
    if (!log) return;
    d.off = Object.fromEntries(Object.keys(STAGE_NAMES).map(k => [k, off(k)]));
    renderStages(d.stages, d);
    const fk = d.job.running ? "running" : Object.keys(STAGE_NAMES).filter(k => d.stages[k]?.status === "failed").join(",");
    if (fk !== failKey) { failKey = fk; if (d.job.running) $("#fail").innerHTML = ""; else loadFail(); }
    if (d.lines.length) { log.textContent += d.lines.join("\n") + "\n"; log.scrollTop = log.scrollHeight; }
    if (d.sys) {  // live memory while a job runs: system RAM, and what the job holds on each GPU
      const bar = (label, used, total, warn) => `<div class="hbar" title="${label}"><span style="min-width:84px">${label}</span><div class="track"><div style="width:${Math.min(100, 100 * used / Math.max(total, 0.1)).toFixed(1)}%;background:${warn ? "var(--orange)" : "var(--bar-caught)"}"></div></div><span class="mono" style="white-space:nowrap">${used.toFixed(1)}/${Math.round(total)} GB</span></div>`;
      const r = d.sys.ram, gmax = Math.max(0, ...(HW?.gpus || []).map(g => g.memory_gb));
      $("#mem").hidden = !d.job.running;
      $("#membars").innerHTML = bar("System RAM", r.used_gb, r.total_gb, r.used_gb > 0.9 * r.total_gb)
        + d.sys.gpus.map((g, i) => ({ ...g, i })).filter(g => g.vram_gb >= 0.5).map(g => bar(`GPU ${d.sys.gpus.length > 1 ? g.i : ""}`.trim(), g.vram_gb, gmax || g.vram_gb, gmax && g.vram_gb > 0.85 * gmax)).join("")
        + (r.used_gb > 0.9 * r.total_gb ? `<div class="callout warn">${icon("bang", 18, 2)}<span>System memory is nearly full. Close other big programs; if it runs out, the training job is stopped first (your other programs are kept).</span></div>` : "");
    }
    $("#go").disabled = $("#retrain").disabled = d.job.running;
    $("#stop").disabled = !d.job.running;
    $("#delww").disabled = $("#conv").disabled = d.job.running;
    const pr = d.progress, run = Object.entries(d.stages).find(([, s]) => s?.status === "running");
    let pct = null, label = "";
    if (d.job.running && run) {
      const [s] = run;
      if (s === "generate") {
        const parts = ["positive", "negative"].map(k => pr["generate-" + k]).filter(Boolean);
        const fresh = parts.filter(x => x.time >= (d.stages.generate?.started || 0));
        if (fresh.length) label = fresh.map(x => `${x.split} ${x.done}/${x.total}`).join(" · ");
        // a part's progress file holds only its current split: count earlier splits as done
        const order = { positive: ["positive_train", "positive_test"], negative: ["negative_train", "negative_test"] };
        const sizes = { positive_train: p.samples.positive, positive_test: p.samples.positive_test, negative_train: p.samples.negative, negative_test: p.samples.negative_test };
        let done = 0, work = Object.values(sizes).reduce((a, b) => a + b, 0);
        for (const [part, splits] of Object.entries(order)) {
          const x = pr["generate-" + part]; if (!x) continue;
          if (x.time < (d.stages.generate?.started || 0)) {  // left from an earlier run: no work this time
            work -= splits.reduce((a, sp) => a + sizes[sp], 0); continue;
          }
          const i = splits.indexOf(x.split); splits.slice(0, i).forEach(sp => done += sizes[sp]); done += x.done;
        }
        if (work > 0) pct = 100 * done / work;
      } else if (s === "conversational" && pr["generate-conversational"]?.time >= (d.stages.conversational?.started || 0)) {
        const x = pr["generate-conversational"]; pct = 100 * x.done / Math.max(1, x.total);
        label = `${x.split === "sentences" ? "writing sentences" : "speaking them"} ${x.done}/${x.total}`;
      } else if (s === "mww-train" && pr["mww-train"]) { pct = 100 * pr["mww-train"].done / pr["mww-train"].total; label = `step ${pr["mww-train"].done.toLocaleString()} of ${pr["mww-train"].total.toLocaleString()}`; }
      else if (s === "oww-train" && pr["oww-train"]) {
        const o = pr["oww-train"], n = p.openwakeword.steps;
        pct = 100 * (o.phase === 1 ? o.done : n + (o.phase - 2) * n / 10 + o.done) / (1.2 * n);
        label = `phase ${o.phase} of 3, step ${o.done} of ${o.total}`;
      }
      else if (pr.bar && s.endsWith("features")) { pct = pr.bar.percent; label = `${pr.bar.desc} ${pr.bar.done}/${pr.bar.total}`; }
      const t = timeLeft(d, s, pct);
      if ($("#sbar")) $("#sbar").style.width = (pct ?? 3) + "%";
      $("#prog").innerHTML = `<section class="overall" aria-label="Progress"><div style="flex:1 1 320px;display:flex;flex-direction:column;gap:10px">
          <div class="row" style="justify-content:space-between"><b style="color:#fff">${esc(STAGE_NAMES[s])}${label ? ": " + esc(label) : ""}</b><span class="hint">${t.stage}</span></div>
          <div class="bar" role="progressbar" aria-label="This step" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(pct ?? 0)}"><div style="width:${pct ?? 3}%"></div></div>
          <div class="hint">Estimated from this machine's measured rates.</div></div>
        <div class="row" style="gap:28px"><div><div class="big">${t.total}</div><div class="hint">to go</div></div>
          <div><div class="big">${t.end}</div><div class="hint">done around</div></div></div></section>`;
    } else if (d.job.running) {
      $("#prog").innerHTML = `<div class="callout info">${icon("spin", 18, 2)}<span>${esc(d.job.title)} running…</span></div>`;
    } else $("#prog").innerHTML = "";
    if (wasRunning !== d.job.running) { watchJobs(); if (wasRunning) hardware(); }
    wasRunning = d.job.running;
  };
}

// The verdict: this version against the one on the devices, on the same test clips (verdict.py).
function verdictPanel(p, base) {
  const el = $("#verdict"), vs = Object.values(p.verdict || {});
  const tested = Object.keys(p.results || {}).length;
  const line = v => v.error ? `<div class="callout warn">${icon("bang", 18, 2)}<span>${esc(v.error)}</span></div>`
    : `<div class="callout ${v.better ? "info" : "warn"}">${icon(v.better ? "check" : "bang", 18, 2)}<span>${esc(v.sentence)}</span></div>`;
  if (!Object.keys(p.live_version || {}).length) {
    el.innerHTML = `<h2 id="h-vd">Against what's on your devices</h2><p class="hint" style="margin:0">No version of ${esc(p.word || p.label)} is marked live yet. When a model goes on your devices, mark it <b>live</b> under Models below: every new version is then compared with it here.</p>`;
    return;
  }
  el.innerHTML = `<h2 id="h-vd">Against what's on your devices</h2>
    ${vs.length ? vs.map(line).join("") : `<p class="hint" style="margin:0">${tested ? "Not compared yet." : "Test this version first; then it is compared by itself."}</p>`}
    <div class="row"><button type="button" id="vdgo" ${tested ? "" : "disabled"}>${vs.length ? "Compare again" : "Compare with the version on your devices"}</button><span class="hint" id="vdmsg"></span></div>
    <p class="hint" style="margin:0">Both models are scored on this version's test recordings; the cutoff shown is the one that catches the most without more false triggers than the live model. Nothing changes on your devices.</p>`;
  $("#vdgo").onclick = async () => { $("#vdmsg").textContent = "scoring the live model, about a minute…"; $("#vdgo").disabled = true;
    try { p.verdict = await api(base + "/verdict", { method: "POST" }); verdictPanel(p, base); } catch (e) { $("#vdmsg").textContent = e.message; $("#vdgo").disabled = false; } };
}
// Each cutoff in everyday terms: calls caught and missed, false alarms a day on the devices.
async function everydayPanel(p, base, picks, rerender) {
  const kind = p.microwakeword.enabled ? "mww" : "oww", el = $("#everyday");
  let d; try { d = await api(`${base}/everyday?kind=${kind}`); } catch { return; }
  el.hidden = false;
  let i = d.rows.findIndex(r => Math.abs(r.cutoff - picks[kind]) < 1e-9); if (i < 0) i = Math.floor(d.rows.length / 2);
  const say = () => {
    const r = d.rows[i], miss = d.positives - r.caught;
    const caught = `Catches <b>${r.caught} of ${d.positives}</b> test takes: ${miss ? `misses about <b>1 in ${Math.max(1, Math.round(d.positives / miss))}</b>` : "<b>misses none</b>"}.`;
    const fa = d.days ? `About <b>${(r.device_false / d.days).toFixed(r.device_false / d.days < 10 ? 1 : 0)} false alarms a day</b> across your devices (${r.device_false} on ${d.device_clips} test device clips over ${d.days.toFixed(1)} days).`
      : `<b>${r.false} false trigger${r.false === 1 ? "" : "s"}</b> on ${d.negatives.toLocaleString()} not-the-phrase clips. <span class="hint">(No test device clips with times here, so no daily rate.)</span>`;
    $("#edtxt").innerHTML = `<p style="margin:0">${caught}</p><p style="margin:0">${fa}</p>`;
    $("#edcut").textContent = r.cutoff.toFixed(2);
  };
  el.innerHTML = `<h2 id="h-ed">The cutoff in everyday terms</h2>
    <label class="f" for="edr">Cutoff <span class="mono" id="edcut"></span><span class="hint">left: catches more, more false alarms · right: fewer false alarms, more misses</span>
      <input type="range" id="edr" min="0" max="${d.rows.length - 1}" step="1" value="${i}" style="width:100%;accent-color:var(--cyan)"></label>
    <div id="edtxt" style="display:flex;flex-direction:column;gap:6px"></div>
    <div class="row"><button type="button" id="eduse">Use this cutoff</button><span class="hint" id="edmsg"></span></div>
    ${d.half ? `<p class="hint" style="margin:0">Counted on the half of the test recordings that wasn't used to pick the model.</p>` : ""}`;
  say();
  $("#edr").oninput = () => { i = +$("#edr").value; say(); $("#edmsg").textContent = ""; };
  $("#eduse").onclick = () => { picks[kind] = d.rows[i].cutoff; rerender(); $("#edmsg").textContent = "chosen: Export below writes it into the model files"; };
}
async function resultsTab(p, base, steps) {
  const v = $("#view");
  const picks = { mww: p.microwakeword.cutoff, oww: p.openwakeword.threshold };
  v.innerHTML = `${steps("results")}<div><div class="kicker">${esc(p.label)}</div><h1>Results &amp; cutoff</h1>
      <p class="sub">The cutoff is the score a sound must reach to count as the wake word. Higher means fewer false triggers and more misses. Click a row to choose it.</p></div>
    <section class="panel" aria-labelledby="h-vd" id="verdict"></section>
    <section class="panel" aria-labelledby="h-ed" id="everyday" hidden></section>
    <section class="panel" aria-labelledby="h-runs" id="runs" hidden></section>

    <div class="cols"><section class="panel wide" aria-labelledby="h-rv"><h2 id="h-rv">Review labels</h2>
        <p class="hint" style="margin:0">Lists your recordings the model disagrees with: usually labeling mistakes. Mark what was really said, then "Retrain from recordings" on the Training page. Held-out clips are never moved.</p>
        <div class="row"><select id="rmodel" style="width:auto"><option value="mww">microWakeWord</option><option value="oww">openWakeWord</option></select>
          <button type="button" id="rbuild">Build review list</button>
          <a id="ropen" href="/p/${enc(p.name)}/review/" target="_blank">Open review page (${p.review_clips} clips)</a></div></section>
      <aside class="narrow"><div class="summary"><h2>Export</h2><p class="hint" style="margin:0;color:var(--soft)">The chosen cutoffs go into the exported files.</p>
        ${p.combined && p.microwakeword.enabled ? `<div class="radio" role="radiogroup" aria-label="microWakeWord model">
          <label><input type="radio" name="mwwpick" value="single" ${p.microwakeword.combine ? "" : "checked"}><span><b>Kept candidate</b><span class="hint">one model</span></span></label>
          <label><input type="radio" name="mwwpick" value="combined" ${p.microwakeword.combine ? "checked" : ""}><span><b>Combined</b><span class="hint">${esc(p.combined.note)}; ${p.combined.candidates.length}x size and tensor arena</span></span></label></div>` : ""}
        <button type="button" class="primary" id="export">${icon("down", 18, 2)}Export with these cutoffs</button><div class="files" id="files"></div>
        ${p.data_profile === "personal" ? `<p class="hint" style="margin:0">Trained with data that allows non-commercial use only: these models are for personal use. <a href="#/data">Why</a></p>` : ""}</div></aside></div>
    <section class="panel" aria-labelledby="h-models" id="models"></section>`;
  modelsPanel(p, base);
  verdictPanel(p, base);
  everydayPanel(p, base, picks, () => renderResults(p.results));
  api(base + "/candidates").then(c => {  // best of N: which microWakeWord candidate was kept, and why
    const now = c?.candidates?.length, prev = c?.previous;
    if (!now && !prev) return;
    const el = $("#cands"), held = now && c.candidates.some(x => "caught" in x), two = !!c?.split;
    el.hidden = false;
    // the previous round's candidates, kept when a new best-of-N run starts (mww/candidates.previous)
    const prevRow = prev ? `<div class="row"><span class="hint" style="flex:1 1 300px"><b>Previous round:</b> ${prev.candidates} candidate${prev.candidates === 1 ? "" : "s"} kept (${prev.numbers.map(n => `s${n}${n === prev.picked ? " (was kept)" : ""}`).join(", ")})${prev.combined ? ", with its combined model" : ""}. Combining them builds a new combined model from that round, in place of the current one; it is tested like any model.</span>
        ${prev.candidates > 1 ? `<button type="button" id="combprev">Combine previous</button>` : ""}</div>` : "";
    el.innerHTML = !now ? `<h2 id="h-cands">microWakeWord candidates</h2>${prevRow}` : `<h2 id="h-cands">microWakeWord candidates</h2>
      <p class="hint" style="margin:0">Training ran ${c.candidates.length} times with different seeds (runs of one recipe differ a lot) and kept the one marked: ${esc(c.why)}.</p>
      ${two ? `<p class="hint" style="margin:0"><b>Picked on</b> half of your test recordings (${c.split.pick.positives} phrase clips, ${c.split.pick.negatives} others). <b>Reported on</b> the other half (${c.split.report.positives} phrase clips, ${c.split.report.negatives} others), which played no part in choosing: the results below come from it, so they aren't flattered by the choice.</p>`
        : held && c.split_note ? `<div class="callout warn">${icon("bang", 18, 2)}<span>Picked and reported on the same recordings: ${esc(c.split_note)}.</span></div>`
        : held ? `<p class="hint" style="margin:0">Picked and reported on the same test recordings (trained before the split into halves), so the kept one's numbers look a little better than they are.</p>` : ""}
      <div class="tablebox"><table><thead><tr><th scope="col">Run</th><th scope="col">Seed</th><th scope="col">Validation</th>
        ${held ? `<th scope="col">Test takes caught${two ? " (picked on)" : ""}</th><th scope="col">False triggers${two ? " (picked on)" : ""}</th>` : ""}
        ${two ? `<th scope="col">Caught (other half)</th><th scope="col">False (other half)</th>` : ""}</tr></thead><tbody>
      ${c.candidates.map(x => `<tr class="${x.n === c.picked ? "pick" : ""}"><td class="mono">s${x.n}${x.n === c.picked ? ` <span class="badge warn" style="padding:2px 8px">kept</span>` : ""}</td>
        <td class="mono">${x.seed}</td><td class="mono">${x.failed ? `<span class="err">failed</span>` : x.validation == null ? "–" : x.validation.toFixed(3)}</td>
        ${held ? `<td class="mono">${x.caught ?? "–"}/${x.positives ?? "–"}</td><td class="mono">${x.false ?? "–"}/${x.negatives ?? "–"}${x.cutoff != null ? ` at ${x.cutoff.toFixed(2)}` : ""}</td>` : ""}
        ${two ? `<td class="mono">${x.report ? `${x.report.caught}/${x.report.positives}` : "–"}</td><td class="mono">${x.report ? `${x.report.false}/${x.report.negatives}` : "–"}</td>` : ""}</tr>`).join("")}
      </tbody></table></div>
      <div class="row"><span class="hint" style="flex:1 1 300px">${p.combined
        ? `Combined model: ${esc(p.combined.note)}, ${Math.round(p.combined.bytes / 1024)} KB, tensor arena ${p.combined.tensor_arena_size.toLocaleString()}. It averages the candidates' scores: fewer false triggers for the same takes caught. Its results are below; choose it under Export.`
        : `Combine them: one model that averages all of them. Fewer false triggers for the same takes caught, ${c.candidates.filter(x => !x.failed).length}x the size.`}</span>
        <button type="button" id="combine">${p.combined ? "Rebuild combined model" : "Combine the candidates"}</button></div>${prevRow}`;
    const run = previous => async () => {
      $("#err").textContent = "";
      try { await api(base + "/combine", { method: "POST", body: previous ? { previous: true } : {} }); location.hash = `#/p/${enc(p.name)}/train`; }
      catch (e) { $("#err").textContent = e.message; }
    };
    if ($("#combine")) $("#combine").onclick = run(false);
    if ($("#combprev")) $("#combprev").onclick = run(true);
  }).catch(() => {});
  let sets = null;  // test results per test set (source folder), at every cutoff
  const drawSets = () => {
    const box = $("#sets"), kinds = ["mww", "mww-combined", "oww"].filter(k => sets?.[k]?.sets.length);
    if (!kinds.length) { box.hidden = true; return; }
    box.hidden = false;
    const rows = new Map();
    kinds.forEach(k => sets[k].sets.forEach(x => rows.set(x.id, { ...x, ...rows.get(x.id) })));
    const cell = (k, id) => {
      const x = sets[k].sets.find(s => s.id === id), i = sets[k].cutoffs.findIndex(c => Math.abs(c - picks[k.split("-")[0]]) < 1e-9);
      return x && i >= 0 ? `<td class="mono">${x.hits[i]}/${x.clips}</td>` : `<td class="hint">–</td>`;
    };
    const group = (phrase, title) => { const list = [...rows.values()].filter(x => x.phrase === phrase);
      return list.length ? `<tr><td colspan="${kinds.length + 1}" class="hint" style="font-weight:600">${title}</td></tr>` + list.map(x => {
        const [src, folder] = x.id.split(/\/(.*)/), alike = !phrase && /synthetic|look-?alike|sound-?alike/i.test(x.note);
        return `<tr><td>${alike ? "Sound-alikes" : SET_NAMES[src] || SET_NAMES.other}${folder ? ` <span class="mono hint">${esc(folder)}</span>` : ""}${x.note ? `<div class="hint">${esc(x.note)}</div>` : ""}</td>${kinds.map(k => cell(k, x.id)).join("")}</tr>`; }).join("") : ""; };
    box.innerHTML = `<h2 id="h-sets">By test set</h2>
      <p class="hint" style="margin:0">The test clips by where they came from, at the chosen cutoff. A weak spot shows up here even when the totals look fine.${kinds.some(k => sets[k].half === "report") ? " microWakeWord: only the half of the test recordings that played no part in choosing the kept candidate." : ""}</p>
      <div class="tablebox"><table><thead><tr><th scope="col">Test set</th>${kinds.map(k => `<th scope="col">${MODEL_NAMES[k]} at ${picks[k.split("-")[0]].toFixed(2)}</th>`).join("")}</tr></thead><tbody>
      ${group(true, "The phrase: caught")}${group(false, "Not the phrase: false triggers")}</tbody></table></div>`;
  };
  api(base + "/sets").then(r => { sets = r; drawSets(); }).catch(() => {});
  const halfNote = (r, base) => { const f = r.full, row = f.table.find(x => Math.abs(x.threshold - picks[base]) < 1e-9);
    return `<p class="hint" style="margin:0">The kept candidate was chosen using half of your test recordings; the numbers below are from the other half, which played no part in choosing${r.positives_split === false ? " (all the Common Voice takes, which were never used for choosing, and the other half of the other clips)" : ""}.
      ${row ? `On all ${f.positives} + ${f.negatives} test clips, including the half used for choosing (as older runs were reported): ${row.caught}/${f.positives} caught, ${row.false}/${f.negatives} false at ${row.threshold.toFixed(2)}.` : ""}</p>`; };
  const renderResults = res => {
    drawSets();
    $("#results").innerHTML = RESULT_KINDS.filter(k => res[k]).map(k => {
      const r = res[k], maxf = Math.max(1, ...r.table.map(row => row.false)), base = k.split("-")[0];
      return `<section class="panel" aria-labelledby="h-${k}"><div class="row" style="justify-content:space-between"><h2 id="h-${k}">${MODEL_NAMES[k]}</h2>
          <span class="hint">${k.includes("combined") && p.combined ? `${esc(p.combined.note)} · ` : ""}${k.endsWith("-cv") ? `${r.positives} takes from Common Voice speakers it never trained on` : `${r.positives} test phrase clips`} · ${r.negatives} other clips</span></div>
        ${r.half === "report" ? halfNote(r, base) : ""}
        <div class="tablebox"><table data-k="${k}"><thead><tr><th scope="col">Cutoff</th>
          <th scope="col" style="width:42%"><span class="row" style="gap:6px"><span aria-hidden="true" style="width:10px;height:10px;border-radius:2px;background:var(--bar-caught)"></span>Caught</span></th>
          <th scope="col" style="width:30%"><span class="row" style="gap:6px"><span aria-hidden="true" style="width:10px;height:10px;border-radius:2px;background:var(--bar-false)"></span>False triggers</span></th></tr></thead><tbody>
        ${r.table.map(row => { const c = 100 * row.caught / Math.max(1, r.positives), on = Math.abs(row.threshold - picks[base]) < 1e-9;
          return `<tr data-t="${row.threshold}" class="${on ? "pick" : ""}" aria-selected="${on}"><td class="mono">${row.threshold.toFixed(2)}${on ? ` <span class="badge warn" style="padding:2px 8px">chosen</span>` : ""}</td>
          <td><div class="hbar" title="${row.caught} of ${r.positives} caught"><div class="track"><div style="width:${c.toFixed(1)}%;background:var(--bar-caught)"></div></div><span class="mono">${row.caught}/${r.positives}</span></div></td>
          <td><div class="hbar" title="${row.false} of ${r.negatives} false"><div class="track"><div style="width:${(100 * row.false / maxf).toFixed(1)}%;background:var(--bar-false)"></div></div><span class="mono">${row.false}/${r.negatives}</span></div></td></tr>`; }).join("")}
        </tbody></table></div></section>`;
    }).join("") || `<div class="callout info">${icon("info", 18, 2)}<span>No results yet. They appear after the test, which needs real recordings with a HELDOUT.txt: add them under <a href="#/p/${enc(p.name)}/voices">Real voices</a>. You can still export the trained models.</span></div>`;
  };
  const kinds = files => [["microwakeword", "microWakeWord (ESPHome)"], ["openwakeword", "openWakeWord"]].filter(([k]) => files.some(f => f.startsWith(k + "/")));
  const renderFiles = files => $("#files").innerHTML = files.length ? kinds(files).map(([k, label]) =>
      `<a class="btn" style="margin-top:8px" href="${base}/zip/${k}" download>${icon("down", 16, 2)}${label} (.zip)</a>`).join("") +
    `<details class="qa" style="margin-top:10px"><summary>Single files</summary>${files.map(f => `<a href="${base}/files/${f.split("/").map(enc).join("/")}" download>${esc(f)}</a>`).join("")}</details>` : "";
  renderResults(p.results); renderFiles(p.exported);
  // the round advisor (optional AI assistant): advice on the numbers above, it changes nothing
  (AI ? Promise.resolve(AI) : aiLoad()).then(ai => {
    const el = $("#advice");
    if (!el || !ai.enabled || !Object.keys(p.results).length) return;
    el.hidden = false;
    el.innerHTML = `<h2 id="h-adv">Advice</h2>
      <p class="hint" style="margin:0">Ask your AI model which cutoff to use, whether this model looks ready for a device, and what to record next.
        It is sent the numbers on this page (with the cutoffs chosen above), the candidates and device-clip counts. Advice only: nothing changes.</p>
      <div class="row"><button type="button" id="askadv">${icon("help", 16)}Ask for advice</button><span class="hint" id="advmsg"></span></div>
      <div class="err" id="adverr"></div><div id="advout" style="display:flex;flex-direction:column;gap:10px"></div>`;
    $("#askadv").onclick = async () => {
      const b = $("#askadv"); b.disabled = true; $("#adverr").textContent = "";
      $("#advmsg").textContent = "asking your model: this can take a minute…";
      try {
        const r = await api(base + "/advice", { method: "POST", body: { cutoff: picks.mww, threshold: picks.oww } });
        $("#advout").innerHTML = aiAnswer(r, `<details class="qa"><summary>The numbers it was given</summary><pre class="log">${esc(JSON.stringify(r.numbers, null, 1))}</pre></details>`);
        $("#advmsg").textContent = "";
      } catch (e) { $("#adverr").textContent = e.message; $("#advmsg").textContent = ""; }
      finally { b.disabled = false; }
    };
  });
  // past runs, side by side at one cutoff
  let runs = [], cut = null, model = p.microwakeword.enabled ? "mww" : "oww", whole = false;
  const pick = new Set();
  // a best-of-N run reports on the half of the test clips not used for choosing; "whole" shows all of them
  const resOf = (r, k) => { const t = r.results[k]; return t && whole && t.full ? t.full : t; };
  const atCut = (r, k) => { const t = resOf(r, k); if (!t) return null; const row = t.table.find(x => Math.abs(x.threshold - cut) < 1e-9); return row ? { ...row, pos: t.positives, neg: t.negatives } : null; };
  const name = r => r.label || r.title.replace(/^train /, "") || r.id;
  const when = r => new Date(r.time * 1000).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  const drawRuns = () => {
    const box = $("#runs");
    if (!runs.length) { box.hidden = true; return; }
    const kinds = RESULT_KINDS.filter(k => runs.some(r => r.results[k]));
    if (!kinds.length) { box.hidden = true; return; }  // runs without test results: nothing to compare
    box.hidden = false;
    if (!kinds.includes(model)) model = kinds[0];
    const cuts = [...new Set(runs.flatMap(r => r.results[model]?.table.map(x => x.threshold) || []))].sort((a, b) => a - b);
    if (cut == null || !cuts.includes(cut)) cut = cuts.includes(picks[model.split("-")[0]]) ? picks[model.split("-")[0]] : cuts[Math.floor(cuts.length / 2)];
    const shown = runs.filter(r => pick.has(r.id) && r.results[model]);
    const maxf = Math.max(1, ...shown.map(r => atCut(r, model)?.false || 0));
    const sameTest = new Set(shown.map(r => `${resOf(r, model).positives}/${resOf(r, model).negatives}`)).size <= 1;
    const halves = runs.some(r => r.results[model]?.full);
    box.innerHTML = `<div class="row" style="justify-content:space-between"><h2 id="h-runs">Runs</h2>
        <div class="row">${kinds.length > 1 ? `<div class="seg" role="group" aria-label="Model">${kinds.map(k => `<button type="button" data-model="${k}" aria-selected="${k === model}">${MODEL_NAMES[k].replace("Common Voice speakers", "CV")}</button>`).join("")}</div>` : ""}
        ${halves ? `<label class="f" style="flex-direction:row;align-items:center;gap:8px">Clips <select id="rwhole" style="width:auto"><option value="">the half not used for choosing</option><option value="1" ${whole ? "selected" : ""}>all test (as older runs)</option></select></label>` : ""}
        <label class="f" style="flex-direction:row;align-items:center;gap:8px">Cutoff <select id="rcut" style="width:auto">${cuts.map(c => `<option value="${c}" ${c === cut ? "selected" : ""}>${c.toFixed(2)}</option>`).join("")}</select></label></div></div>
      ${sameTest ? "" : `<div class="callout warn">${icon("bang", 18, 2)}<span>These runs were tested on different test recordings, so their numbers aren't directly comparable.</span></div>`}
      <div class="tablebox"><table><thead><tr><th scope="col">Compare</th><th scope="col">Run</th>
        <th scope="col" style="width:30%"><span class="row" style="gap:6px"><span aria-hidden="true" style="width:10px;height:10px;border-radius:2px;background:var(--bar-caught)"></span>Caught</span></th>
        <th scope="col" style="width:24%"><span class="row" style="gap:6px"><span aria-hidden="true" style="width:10px;height:10px;border-radius:2px;background:var(--bar-false)"></span>False triggers</span></th><th scope="col"><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Actions</span></th></tr></thead><tbody>
      ${runs.map((r, i) => { const x = atCut(r, model), on = pick.has(r.id);
        return `<tr><td><input type="checkbox" data-pick="${r.id}" ${on ? "checked" : ""} aria-label="Compare ${esc(name(r))}" style="width:20px;height:20px;accent-color:var(--orange)"></td>
          <td><button type="button" class="tag" data-label="${r.id}" data-cur="${esc(r.label)}" title="rename" style="font-size:14px;background:transparent;padding:0;color:var(--text);justify-content:flex-start;text-align:left;font-weight:600">${esc(name(r))}</button>${i === 0 ? ` <span class="badge info" style="padding:2px 8px">latest</span>` : ""}<div class="hint">${when(r)} · ${r.results[model] ? `${resOf(r, model).positives} test · ${resOf(r, model).negatives} other${r.results[model].full && !whole ? " · the half not used for choosing" : ""}` : "no results for this model"}</div></td>
          ${x && on ? `<td><div class="hbar" title="${x.caught} of ${x.pos} caught"><div class="track"><div style="width:${(100 * x.caught / Math.max(1, x.pos)).toFixed(1)}%;background:var(--bar-caught)"></div></div><span class="mono">${x.caught}/${x.pos}</span></div></td>
            <td><div class="hbar" title="${x.false} of ${x.neg} false"><div class="track"><div style="width:${(100 * x.false / maxf).toFixed(1)}%;background:var(--bar-false)"></div></div><span class="mono">${x.false}/${x.neg}</span></div></td>`
            : `<td class="hint">${on ? "no row at this cutoff" : ""}</td><td></td>`}
          <td><div class="row" style="gap:6px;flex-wrap:nowrap">${r.exported.map(k => `<a class="btn" style="min-height:36px;padding:0 10px;font-size:13px" href="${base}/runs/${r.id}/zip/${k}" download title="download ${k}">${icon("down", 14, 2)}${{ microwakeword: "mWW", openwakeword: "oWW" }[k] || k}</a>`).join("")}
            <button type="button" class="round flat" data-rdel="${r.id}" aria-label="Delete run ${esc(name(r))}">${icon("trash", 16)}</button></div></td></tr>`; }).join("")}
      </tbody></table></div><p class="hint" style="margin:0">Every run that finishes is kept here. Click a run's name to rename it (e.g. "added soft takes").</p>`;
  };
  const loadRuns = async () => { runs = await api(base + "/runs"); runs.slice(0, 3).forEach(r => pick.add(r.id)); drawRuns(); };
  $("#runs").onclick = async e => {
    const m = e.target.closest("[data-model]"), lb = e.target.closest("[data-label]"), dl = e.target.closest("[data-rdel]");
    try {
      if (m) { model = m.dataset.model; cut = null; drawRuns(); }
      if (lb) { const v = prompt("Name this run", lb.dataset.cur); if (v !== null) { await api(`${base}/runs/${lb.dataset.label}/label`, { method: "POST", body: { label: v } }); await loadRuns(); } }
      if (dl && await ask("Delete this run?", "Its kept results and model files are removed. The project and its other runs stay.", "Delete run")) { await api(`${base}/runs/${dl.dataset.rdel}`, { method: "DELETE" }); pick.delete(dl.dataset.rdel); await loadRuns(); }
    } catch (x) { $("#err").textContent = x.message; }
  };
  $("#runs").onchange = e => {
    if (e.target.id === "rcut") { cut = +e.target.value; drawRuns(); }
    if (e.target.id === "rwhole") { whole = !!e.target.value; drawRuns(); }
    if (e.target.dataset.pick) { e.target.checked ? pick.add(e.target.dataset.pick) : pick.delete(e.target.dataset.pick); drawRuns(); }
  };
  loadRuns().catch(e => $("#err").textContent = e.message);
  $("#results").onclick = e => {
    const tr = e.target.closest("tr[data-t]"); if (!tr) return;
    picks[tr.closest("table").dataset.k.split("-")[0]] = +tr.dataset.t; renderResults(p.results);
  };
  $("#export").onclick = async () => {
    $("#err").textContent = "";
    const mp = document.querySelector("input[name=mwwpick]:checked");
    try { renderFiles(await api(base + "/export", { method: "POST", body: { cutoff: picks.mww, threshold: picks.oww, ...(mp ? { combined: mp.value === "combined" } : {}) } })); modelsPanel(p, base); }
    catch (e) { $("#err").textContent = e.message; }
  };
  $("#rbuild").onclick = async () => {
    $("#err").textContent = "";
    try { await api(base + "/review/build", { method: "POST", body: { model: $("#rmodel").value } }); $("#ropen").textContent = "Review list is being built (see Training)…"; }
    catch (e) { $("#err").textContent = e.message; }
  };
}

// ---- model history: every exported model, its status (exported, offered, live, retired) and notes ----
const KIND_NAMES = { mww: "microWakeWord", oww: "openWakeWord" };
const STATUS_BADGE = { exported: "idle", offered: "info", live: "ok", retired: "idle" };
// Clipboard API where allowed, else the old select-and-copy (plain http on the LAN has no clipboard API)
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return; } catch {}
  const a = document.createElement("textarea"); a.value = t; a.style.position = "fixed"; a.style.opacity = "0";
  document.body.append(a); a.select(); const ok = document.execCommand("copy"); a.remove();
  if (!ok) throw new Error("couldn't copy: select the sha by hand");
}
const liveLine = live => Object.entries(live || {}).map(([k, s]) => `${KIND_NAMES[k]} <span class="mono">${esc(s)}</span>`).join(" · ");
async function modelsPanel(p, base) {
  const box = $("#models");
  let list = [], msg = "";
  const when = t => new Date(t * 1000).toLocaleString([], { year: "numeric", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  const since = e => { const h = e.history; let i = h.length - 1; while (i > 0 && h[i - 1].status === e.status) i--; return h[i].time; };

  };
  const load = async () => { list = await api(base + "/models"); draw(); };
  const note = (kind, text) => `<div class="callout ${kind}">${icon(kind === "warn" ? "bang" : "info", 18, 2)}<span>${text}</span></div>`;
  box.onclick = async e => {

      if (f) { f.disabled = true; const r = await api(base + "/models/backfill", { method: "POST" });

    } catch (x) { msg = note("warn", esc(x.message)); draw(); }
  };
  box.onchange = async e => {
    const s = e.target.dataset.status, n = e.target.dataset.notes;
    try {

        const r = await api(`${base}/models/${s}/status`, { method: "POST", body: { status: e.target.value } });
        msg = r.retired.length ? note("info", `<span class="mono">${esc(r.entry.sha)}</span> is live now; ${r.retired.map(x => `<span class="mono">${esc(x)}</span>`).join(", ")}, live before, is marked retired.`) : "";
        await load();
      }
      if (n !== undefined) { await api(`${base}/models/${n}/notes`, { method: "POST", body: { notes: e.target.value } }); msg = ""; }
    } catch (x) { msg = note("warn", esc(x.message)); await load().catch(() => draw()); }
  };
  try { await load(); } catch (x) { msg = note("warn", esc(x.message)); draw(); }
}

// ---- record a room: one long recording for every wake word, split into takes (sessions.py) -------------
// The phone lies next to the device; the person walks around and follows the script. Audio goes up in
// ~10 s pieces while recording, so a page that dies loses at most the last piece.
const ROOM_LABELS = { spot: "spot marker", other: "other speech: not the phrase, all", room: "room sound: not the phrase, all",
  clap: "clap: room echo", unclear: "unclear: left out", skip: "leave out" };
const fmtT = t => `${Math.floor(t / 60)}:${(t % 60).toFixed(1).padStart(4, "0")}`;
function roomScript(phrases, spots) {
  const said = phrases.map(p => `"${p}" 3 times`).join(", pause, then ");
  return [`Put the phone next to the device, screen up, and press Start. Then leave it there.`,
    `Stay quiet for 10 seconds (room sound).`,
    `Clap 3 times, about 2 seconds apart, from the middle of the room.`,
    ...spots.map(s => `${s[0].toUpperCase() + s.slice(1)}: say the spot out loud ("${s}"), wait a moment, then say ${said}.`),
    `Walk back to the phone and press Stop.`];
}

          <div class="err" id="err"></div></div></section></div>
    <aside class="narrow"><section class="panel" aria-labelledby="h-rp"><h2 id="h-rp">Earlier recordings</h2><ul class="takes" id="rlist"></ul>
      <p class="hint" style="margin:0">${info.house_rirs ? `${info.house_rirs} clap${info.house_rirs > 1 ? "s" : ""} saved as this house's room echoes.` : "Claps become this house's room echoes once you send a recording."}</p></section></aside></div>`;
  $("#rlist").innerHTML = info.sessions.map(s => `<li><a href="#/room/${enc(s.id)}" style="flex:1 1 160px"><b>${esc(s.room)}</b></a>

    || `<li class="hint">None yet.</li>`;
  const picked = () => [...document.querySelectorAll("input[name=rproj]:checked")].map(x => x.value);
  const spots = () => [...document.querySelectorAll("input[name=rspot]:checked")].map(x => x.value);
  const phrases = () => { const seen = []; for (const n of picked()) { const ph = info.projects.find(p => p.name === n).phrase; if (!seen.includes(ph)) seen.push(ph); } return seen; };
  const steps = () => { $("#rsteps").innerHTML = roomScript(phrases(), spots()).map(s => `<li>${esc(s)}</li>`).join(""); };
  steps();
  $("#rsetup").onchange = e => { if (e.target.name === "rproj" || e.target.name === "rspot") steps(); };
  $("#rprint").onclick = () => {
    const w = window.open("", "_blank");
    if (!w) return;
    w.document.write(`<!doctype html><title>Recording script</title><body style="font:18px/1.6 sans-serif;max-width:40em;margin:2em auto">
      <h1>Record a room: ${esc($("#rroom").value || "")}</h1><ol>${roomScript(phrases(), spots()).map(s => `<li>${esc(s)}</li>`).join("")}</ol></body>`);
    w.document.close(); w.print();
  };
  let levels = Array(32).fill(0), R = null;
  const meter = rms => {
    levels.push(Math.min(1, Math.sqrt(rms) * 2.2)); levels = levels.slice(-32);
    const m = $("#rmeter"); if (!m) return;
    [...m.children].forEach((s, i) => { const h = levels[i]; s.style.height = `${4 + h * 36}px`; s.style.background = h > 0.85 ? "var(--orange)" : h > 0.05 ? "var(--gold)" : "#34405a"; });
  };
  const state = m => { if ($("#rstate")) $("#rstate").textContent = m; };
  const lock = async () => { try { if (R && "wakeLock" in navigator && !document.hidden) R.lock = await navigator.wakeLock.request("screen"); } catch { R && (R.lock = null); } };
  const onVis = () => { if (R && !document.hidden) lock(); };
  const onLeave = e => { if (R) { e.preventDefault(); e.returnValue = ""; } };
  const pump = async () => {  // pieces go up in order; a failed one is retried
    if (!R || R.sending) return;
    R.sending = true;
    try {
      while (R.pending.length) {
        const c = R.pending[0];
        const r = await fetch(`/api/sessions/${enc(R.sid)}/chunk?seq=${c.seq}`, { method: "POST", body: c.blob });
        if (!r.ok) { let m = r.statusText; try { m = (await r.json()).detail || m; } catch {} throw new Error(m); }
        R.pending.shift(); R.sent += c.seconds;
      }
      R.failed = "";
    } catch (e) { R.failed = e.message || "upload failed"; }
    finally { R.sending = false; }
  };
  const flush = () => {  // the audio since the last piece, as a 16 kHz WAV piece
    if (!R.buf.length) return Promise.resolve();
    const seq = R.seq++, chunks = R.buf; R.buf = []; R.bufN = 0;
    return to16k(chunks, R.rate).then(a => { R.pending.push({ seq, blob: wav16(a), seconds: a.length / 16000 }); R.pending.sort((x, y) => x.seq - y.seq); return pump(); });
  };
  const start = async () => {
    $("#err").textContent = "";
    const room = $("#rroom").value.trim(), projects = picked();
    if (!room) { $("#err").textContent = "Name the room first."; $("#rroom").focus(); return; }
    if (!projects.length) { $("#err").textContent = "Pick at least one wake word."; return; }
    const speakers = $("#rspk").value.split(",").map(s => s.trim()).filter(Boolean);
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 1 } }); }
    catch (e) { $("#err").textContent = e.name === "NotAllowedError" ? "The browser blocked the microphone: allow it for this page and try again." : e.message; return; }
    let s;
    try { s = await api("/api/sessions", { method: "POST", body: { room, speakers, projects, spots: spots(), device: navigator.userAgent } }); }
    catch (e) { stream.getTracks().forEach(t => t.stop()); $("#err").textContent = e.message; return; }
    try { localStorage.setItem("ws-room", JSON.stringify({ room, speakers: speakers.join(", ") })); } catch {}
    const ctx = new AudioContext(), url = URL.createObjectURL(new Blob([WORKLET], { type: "text/javascript" }));
    await ctx.resume();
    await ctx.audioWorklet.addModule(url);
    const node = new AudioWorkletNode(ctx, "tap"), src = ctx.createMediaStreamSource(stream);
    src.connect(node);
    R = { sid: s.id, ctx, stream, node, src, url, rate: ctx.sampleRate, buf: [], bufN: 0, got: 0, seq: 0, pending: [], sent: 0, sending: false, failed: "", lock: null, acc: 0, accN: 0, t0: Date.now() };
    node.port.onmessage = e => {
      const d = e.data; R.buf.push(d); R.bufN += d.length; R.got += d.length;
      for (const x of d) R.acc += x * x; R.accN += d.length;
      if (R.accN >= R.rate * 0.05) { meter(Math.sqrt(R.acc / R.accN)); R.acc = 0; R.accN = 0; }
      if (R.bufN >= R.rate * 10) flush();
    };
    await lock();
    document.addEventListener("visibilitychange", onVis); window.addEventListener("beforeunload", onLeave);
    R.tick = setInterval(() => {
      const t = R.got / R.rate, wait = R.pending.reduce((a, c) => a + c.seconds, 0);
      $("#rtime").textContent = fmtT(t).replace(/\.\d$/, "");
      if (R.failed) pump();
      state(`Recording. ${Math.round(R.sent)} s uploaded${wait > 1 ? `, ${Math.round(wait)} s waiting${R.failed ? ` (${R.failed}; retrying)` : ""}` : ""}.`
        + (R.lock && !R.lock.released ? " Screen kept on." : " Keep the screen on: this browser can't do it by itself."));
    }, 1000);
    const b = $("#rgo"); b.classList.add("on"); b.setAttribute("aria-label", "Stop recording"); b.innerHTML = icon("x", 40, 2.5);

    r.src.disconnect(); r.node.disconnect(); r.stream.getTracks().forEach(t => t.stop());
    await flush(); r.ctx.close(); URL.revokeObjectURL(r.url);
    try { await r.lock?.release(); } catch {}
    for (let i = 0; i < 20 && r.pending.length; i++) { state(`Uploading the last ${Math.round(r.pending.reduce((a, c) => a + c.seconds, 0))} s…`); await pump(); if (r.pending.length) await new Promise(res => setTimeout(res, 3000)); }
    if (r.pending.length) {
      state(""); errEl().innerHTML = `${esc(r.failed)}: ${Math.round(r.pending.reduce((a, c) => a + c.seconds, 0))} s are still on this phone. <button type="button" id="rretry">Try again</button>`;
      if ($("#rretry")) $("#rretry").onclick = () => { b.disabled = false; stop2(r, away); };
      return;
    }
    stop2(r, away);
  };
  const stop2 = async (r, away) => {
    await pump();
    if (r.pending.length) { errEl().textContent = `Upload still failing (${r.failed}). Keep this page open and try again.`; return; }
    try { await api(`/api/sessions/${enc(r.sid)}/stop`, { method: "POST" }); } catch (e) { errEl().textContent = e.message; return; }

  };

  const leave = () => { if (R && location.hash !== "#/room") stop(true); window.removeEventListener("hashchange", leave); };
  window.addEventListener("hashchange", leave);
}

      <section class="panel danger-zone" aria-labelledby="h-sdel"><h2 id="h-sdel">Delete</h2><p class="hint" style="margin:0">Removes this recording. Takes already sent stay in the wake words.</p>
        <button type="button" class="danger" id="sdel">${icon("trash", 16)}Delete this recording</button></section>`;
    if ($("#slog")) api(base + "/log").then(r => r.text()).then(t => { if ($("#slog")) $("#slog").textContent = t.split("\n").slice(-12).join("\n"); }).catch(() => {});
  };
  const err = m => { if ($("#err")) $("#err").textContent = m || ""; };
  const refresh = async () => { try { await load(); draw(); } catch (e) { err(e.message); } if (d?.split?.status !== "running") { clearInterval(poll); poll = null; } };
  let player = null;
  box.onclick = async e => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.play) { const x = d.segments.find(s => s.i === +b.dataset.play); player?.pause(); player = new Audio(`${base}/audio?start=${x.start}&end=${x.end}`); player.play().catch(x => err(x.message)); return; }
    if (b.dataset.f) { filter = b.dataset.f; draw(); return; }
    if (b.id === "ssplit") {
      if (d.segments.some(x => x.label !== x.auto) && !await ask("Split again?", "Your changes to the labels are replaced by fresh guesses. Takes already sent are not sent twice.", "Split again")) return;
      try { d = await api(base + (d.session.status === "recording" ? "/stop" : "/split"), { method: "POST" }); msg = ""; draw(); if (!poll) poll = setInterval(refresh, 3000); } catch (x) { err(x.message); }
    }
    if (b.id === "ssend") {
      b.disabled = true; err("");
      try {
        const r = await api(base + "/send", { method: "POST" });
        const lines = Object.entries(r.added).map(([n, a]) => `<li><b>${esc(n)}</b>: ${a.pos} take${a.pos === 1 ? "" : "s"} of the phrase, ${a.neg} not-the-phrase clip${a.neg === 1 ? "" : "s"}${r.errors[n] ? ` · <span style="color:var(--warn)">${esc(r.errors[n])}</span>` : ""}${r.notes?.[n] ? ` · <span class="hint">${esc(r.notes[n])}</span>` : ""}</li>`).join("");
        msg = `<div class="callout ${Object.keys(r.errors).length ? "warn" : "info"}">${icon(Object.keys(r.errors).length ? "bang" : "check", 18, 2)}<span>Sent. Nothing is sent twice.<ul style="margin:6px 0">${lines}</ul>
          ${r.claps ? `${r.claps} clap${r.claps > 1 ? "s" : ""} saved as this house's room echoes: turn on "Use this house's room echoes" on a wake word's Training page to train with them. ` : ""}Retrain from recordings on each wake word to use the new takes.</span></div>`;
        d = r; draw();
      } catch (x) { err(x.message); b.disabled = false; }
    }
    if (b.id === "sdel" && await ask("Delete this recording?", "The audio and the list of pieces go. Takes already sent stay in the wake words.", "Delete")) {
      try { await api(base, { method: "DELETE" }); location.hash = "#/room"; } catch (x) { err(x.message); }
    }
  };
  box.onchange = async e => {
    const t = e.target, i = t.dataset.label ?? t.dataset.spot ?? t.dataset.spk;
    if (i === undefined) return;
    const ch = t.dataset.label !== undefined ? { label: t.value } : t.dataset.spot !== undefined ? { spot: t.value } : { speaker: t.value };
    try { d = await api(base + "/segments", { method: "PUT", body: { changes: { [i]: ch } } }); } catch (x) { err(x.message); }
  };
  try { await load(); } catch (e) { box.innerHTML = `<p class="err">${esc(e.message)}</p>`; return; }
  draw();
  if (d.split?.status === "running") poll = setInterval(refresh, 3000);
}

function viewHelp() {
  nav("#/help");
  const qa = (q, a) => `<details class="qa"><summary>${q}</summary><p>${a}</p></details>`;
  $("#view").innerHTML = `<div><h1>Help</h1><p class="sub">How wakesmith works, what the numbers mean, and what to do when something goes wrong.</p></div>
    <section class="panel" aria-labelledby="h-gs"><h2 id="h-gs">Getting started</h2><ol class="gs">
      <li><span>1</span><b>Say what it's for</b>ESPHome, Home Assistant or your own device. That picks the model type and export.</li>
      <li><span>2</span><b>Type the phrase</b>Two to four syllables. Listen to it, then trim the sound-alikes list.</li>
      <li><span>3</span><b>Add real voices</b>Folders of your own takes, near and far. Optional, but it is the biggest gain.</li>
      <li><span>4</span><b>Train, compare, export</b>Pick the cutoff with the fewest misses you can live with.</li>
      <li><span>5</span><b>Keep improving</b>Your devices save clips when the model fires. Listen to the few that need you, then make a new version and see if it beats the one you have.</li></ol></section>
    <div class="cols"><section class="panel wide" aria-labelledby="h-gl" style="gap:0"><h2 id="h-gl" style="margin-bottom:6px">What the words mean</h2>
      ${qa("Cutoff", "The score (0 to 1) a sound must reach to count as the wake word. Higher means fewer false triggers and more misses. You choose it on Results; it goes into the exported file.")}
      ${qa("Test recordings", "Real recordings listed in HELDOUT.txt and never trained on. They are the honest test: a model always looks good on what it learned from.")}
      ${qa("False trigger", "The model fires on something that is not the phrase: TV, talk, a sound-alike. Counted on your not-the-phrase clips.")}
      ${qa("Sound-alikes", "Words and phrases close to yours (\"commuter\" for \"computer\"). Synthetic voices say them so the model learns to ignore them.")}
      ${qa("Front end", "How a device turns audio into the features a model sees. ESPHome uses the TFLite Micro front end; some custom devices use another. The export is tagged with the one it was trained on.")}
      ${qa("microWakeWord and openWakeWord", "The two model types. microWakeWord runs on small ESP32 boards (ESPHome); openWakeWord runs in Home Assistant's Wyoming add-on and on bigger devices.")}
      ${qa("Candidates", "A Standard run trains microWakeWord several times with different seeds and keeps the one with the fewest false triggers on half of your test recordings. The results come from the other half, which played no part in choosing. Results lists all three and says why one was kept.")}
      ${qa("Combined model", "One microWakeWord file that averages the candidates' scores. Seeds make different mistakes, so the average can fire less on noise without missing calls, but not every round gains: compare it with the kept candidate before choosing it. It is about three times the size and needs three times the tensor arena; it runs anywhere a single model does. Turn it on under Advanced or on the Training page, or press Combine the candidates on Results; choose it under Export. A new run keeps the previous round's candidates: Combine previous on Results averages those instead.")}
      ${qa("Do I have to open each wake word to record?", "No. Record a room makes one recording for all of them: put the phone next to the device, press Start and follow the script (room sound, three claps, then each wake word from each spot). wakesmith cuts it into takes, you check the guesses, and Send puts each take in its own wake word, with room sound and other talk as not-the-phrase clips for all of them. The claps become this house's room echoes for training.")}
      ${qa("Versions (v1, v2, …)", "Each wake word can have several versions: every round of training you try is one, numbered in the order you made them, with a short note on what it tried. The wake words page shows one row per word; the arrow folds out its versions. The version marked Live is the one on your devices. Rename the word or edit a version's note from the ⋯ menu.")}
      ${qa("New version", "In a wake word's ⋯ menu. It copies the version's recipe and recordings, reuses its synthetic voices, brings in the device clips that came since (the clear false alarms labeled by themselves), keeps the newest day of clips aside for the test, trains, and compares the result with what's on your devices. The version before stays as it was.")}
      ${qa("Next step", "The line under a wake word on the wake words page: the one thing worth doing next, such as checking device clips, testing a trained version, or comparing one that beats what's on your devices. No line means nothing is waiting.")}
      ${qa("Better than what's on your devices?", "After a version is tested, the model on your devices is scored on the same test clips, and Results says in one sentence how they compare. It counts as better only when it catches at least as many calls, and either catches more or false-triggers less; one that catches fewer is a trade-off, never better. Two things lean the comparison: device clips in the test were saved because the live model fired or nearly did (against it), and the new version's cutoff is picked on these same clips (for it); the sentence says both. Nothing on your devices changes until you change it.")}
      ${qa("Device clips", "Clips your devices saved when the model fired (or nearly did). Real voices &gt; Device clips brings them in and transcribes them. Clips where Whisper heard none of the phrase's words are labeled “not the phrase” by themselves; the rest wait under Listen. Those false alarms are the best not-the-phrase clips there are.")}
      ${qa("How do I label a device clip?", "Listen to it: the transcript is only Whisper's guess. <b>The phrase</b>: a person in the room says it as a call (your tests count). <b>Not the phrase</b>: it isn't said: TV, music, other talk, a cough, silence. <b>Leave out</b>: you can't tell, it's cut off, or the words are said but not as a call (the TV saying it, or someone using the words in a sentence). Quick check plays one clip at a time: Y, N or L labels it and moves on, Space plays it again, Backspace goes back.")}
      ${qa("What a version learns from", "Real voices &gt; What it learns from lists every source: your recordings, labeled device clips and the synthetic voices, with how many clips train and how many are kept aside for the test, and plays any of them.")}
      ${qa("The cutoff in everyday terms", "On Results, a slider turns each cutoff into calls caught and missed (“misses about 1 in 7”) and, when the test has device clips with times, false alarms a day across your devices.")}
      ${qa("Sync device clips automatically", "Real voices &gt; Device clips &gt; Sync automatically: set the folder your devices' clips arrive in and the model name they carry, then Sync now or turn on Every day. Only new clips are copied and transcribed, so you only listen to the unclear ones; the Wake words card shows how many are waiting.")}
      ${qa("Models list", "Every model you export, with its checksum, cutoff and numbers. Mark one offered or live as it moves to your devices; one model per engine is live at a time.")}
      ${qa("The queue", "Start a run while another is going and it waits its turn: one heavy job at a time keeps memory safe. It goes on even with this page closed; a notice says when each run finishes or fails.")}
      ${qa("AI assistant", "Optional, on the Hardware page: a language model you run yourself explains failed runs, advises on a cutoff, and can write everyday sentences as not-the-phrase clips. It is off until you turn it on, and audio is never sent. What it gets: the numbers, settings and log lines it explains, and your run labels and version notes; point it only at a server you trust (on this computer or your own network).")}</section>
    <aside class="narrow"><section class="panel" aria-labelledby="h-tr" style="gap:0"><h2 id="h-tr" style="margin-bottom:6px">Something wrong?</h2>
      ${qa("Training is slow", "Every heavy stage uses the GPU when there is one (see Hardware); without one, everything runs on the CPU and takes much longer. Close other big programs: worker counts follow free RAM. The Training page shows the time left from this machine's measured rates.")}
      ${qa("A stage says stopped", "The training process ended before the stage finished: Stop was pressed, it ran out of memory, or the machine restarted. The Training page's Why it stopped panel says what the log shows. Press Train to resume from there. microWakeWord needs about 16 GB of RAM.")}
      ${qa("Intel GPU stopped responding", "Check that Intel's compute runtime is 26.35 or newer: run wakesmith doctor, which tests it. A crashed GPU job can leave the driver stuck until a reboot. Reboot, or start wakesmith with --cpu (see Hardware).")}
      ${qa("Not enough disk", "Each project needs about 23 GB, nearly all of it training features. Archive the ones you aren't training (Hardware &gt; Storage): that frees about 20 GB each and keeps recordings, results and models; the next Train rebuilds the features in a few minutes. Wake words idle for 14 days are archived automatically unless a model of theirs is marked offered or live.")}
      ${qa("It misses the word on my device", "Add real recordings from the room the device is in (near and far), retrain from recordings, and compare cutoffs.")}</section>
      <section class="panel dark"><a href="/guide" target="_blank" rel="noopener">Full guide (README)</a>
        <span class="hint">Questions or problems: <a href="https://github.com/HuskerMinion/wakesmith/issues" target="_blank" rel="noopener">open an issue on GitHub</a> with the output of <code class="mono">wakesmith doctor</code>.</span></section></aside></div>`;
}

      <label style="display:flex;gap:12px;align-items:flex-start;min-height:44px;cursor:pointer"><input type="checkbox" id="aion" ${s.enabled ? "checked" : ""} style="width:22px;height:22px;margin:2px 0 0;accent-color:var(--orange)">

        <label class="f grow" for="aikey">API key <span class="hint">${s.has_key ? `saved (${esc(s.key_hint)})` : "only if your server asks for one"}</span>
          <input type="password" id="aikey" autocomplete="off" placeholder="${s.has_key ? "leave empty to keep the saved key" : "none"}"></label>
        <label class="f" for="aitime" style="flex:0 1 150px">Timeout, seconds <input type="number" id="aitime" min="5" max="900" value="${esc(s.timeout)}"></label></div>
      <div class="row"><button type="button" class="primary" id="aisave">Save</button><button type="button" id="aitest">Test</button>
        ${s.has_key ? `<button type="button" class="danger" id="aiforget">Forget the key</button>` : ""}<span class="hint" id="aimsg"></span></div>
      <div class="err" id="aierr"></div><div id="aiout" style="display:flex;flex-direction:column;gap:10px"></div>`;
    const msg = t => $("#aimsg").textContent = t, err = t => $("#aierr").textContent = t || "";
    const save = async extra => {
      const key = $("#aikey").value.trim();
      AI = await api("/api/assistant", { method: "PUT", body: { enabled: $("#aion").checked, base_url: $("#aiurl").value, model: $("#aimodel").value,
        timeout: $("#aitime").value, ...(key ? { api_key: key } : {}), ...extra } });
      return AI;
    };
    $("#aisave").onclick = async () => { err(); try { drawAi(await save()); $("#aimsg").textContent = AI.enabled ? "saved: the assistant is on" : "saved: the assistant is off"; } catch (e) { err(e.message); } };
    if ($("#aiforget")) $("#aiforget").onclick = async () => { err(); try { drawAi(await save({ api_key: "" })); $("#aimsg").textContent = "key forgotten"; } catch (e) { err(e.message); } };
    $("#aitest").onclick = async () => {
      err(); $("#aiout").innerHTML = "";
      if (!$("#aion").checked) { err("Turn the assistant on first: nothing is sent while it's off."); return; }
      const b = $("#aitest"); b.disabled = true; msg("saving and asking your model…");
      try {
        await save();
        const r = await api("/api/assistant/test", { method: "POST" });
        msg(`${r.model || "your model"} answered in ${r.seconds} s`); $("#aiout").innerHTML = `<div class="aians">${mdLite(r.answer)}</div>`;
      } catch (e) { msg(""); err(e.message); }
      finally { b.disabled = false; }
    };
  };
  aiLoad().then(drawAi);
  if (HW) draw(HW); else load();
  storagePanel();
}

// Disk use per wake word, Archive buttons and the auto-archive setting (archive.py).
async function storagePanel() {
  const el = $("#storage"); if (!el) return;
  let d;
  try { d = await api("/api/storage"); } catch (e) { el.innerHTML = `<h2 id="h-sto">Storage</h2><p class="err">${esc(e.message)}</p>`; return; }
  if (!$("#storage")) return;
  const rows = d.projects, days = d.settings.archive_after_days, rule = d.rule_days;
  const idle = rows.filter(r => !r.auto_skip);
  const total = rows.reduce((t, r) => t + r.bytes, 0), free = rows.reduce((t, r) => t + r.freeable, 0);
  const ago = r => r.idle_days < 1 ? "today" : `${Math.floor(r.idle_days)} day${Math.floor(r.idle_days) === 1 ? "" : "s"} ago`;
  const use = r => [r.live && `${r.live} live`, r.offered && `${r.offered} offered`].filter(Boolean).join(", ") || "none";
  const clips = r => r.clips.own ? (r.clips.shared_with.length ? `own, shared with ${r.clips.shared_with.map(esc).join(", ")}` : "own") : r.clips.link_to ? `${esc(r.clips.link_to)}'s` : "none";
  const busy = r => r.running || r.queued;
  el.innerHTML = `<h2 id="h-sto">Storage</h2>
    <p style="margin:0;color:var(--soft)">${rows.length} wake word${rows.length === 1 ? "" : "s"} use ${gb(total)}. Archiving can free ${gb(free)}: it removes only files wakesmith makes again by itself
      (training features, prepared copies of your recordings, spare checkpoints of best-of-N runs). Settings, recordings, device clips, results, exported files and the trained model stay,
      and the next Train rebuilds the features first (a few minutes).</p>
    <div class="err" id="stoerr"></div>
    <div class="tablebox"><table style="min-width:820px"><thead><tr><th scope="col">Wake word</th><th scope="col">Size</th><th scope="col">Can free</th><th scope="col">Last used</th>
      <th scope="col">Models offered or live</th><th scope="col">Synthetic clips</th><th scope="col"></th></tr></thead><tbody>
      ${rows.map(r => `<tr><td><b>${esc(r.label)}</b> <span class="hint mono">${esc(r.name)}</span>${r.archived ? ` <span class="tag">Archived</span>` : ""}${r.running ? ` <span class="badge info">training</span>` : r.queued ? ` <span class="badge idle">queued</span>` : ""}</td>
        <td class="mono">${gb(r.bytes)}</td><td class="mono"${r.kept.length ? ` title="${esc(r.kept.join("\n"))}"` : ""}>${r.freeable >= 1e6 ? gb(r.freeable) : "—"}${r.kept.length ? ` <span class="hint">(some kept)</span>` : ""}</td><td>${ago(r)}</td><td>${use(r)}</td><td>${clips(r)}</td>
        <td><div class="row" style="gap:6px;flex-wrap:nowrap">${r.freeable >= 1e6 ? `<button type="button" data-arch="${esc(r.name)}" ${busy(r) ? "disabled title=\"wait until its job ends\"" : ""}>Archive</button>` : ""}
          ${r.clips.own && !r.clips.shared_with.length && r.freeable_with_clips > r.freeable ? `<button type="button" class="danger" data-arch="${esc(r.name)}" data-clips="1" ${busy(r) ? "disabled" : ""} title="also remove its own synthetic clips">+ clips</button>` : ""}</div></td></tr>`).join("")}
      </tbody></table></div>
    <div class="row"><button type="button" id="archidle" ${idle.length ? "" : "disabled"}>Archive all idle (${idle.length})</button>
      <span class="hint">Idle: nothing happened in it for ${rule} days or more, no job running or queued, and no model marked offered or live on its Models list. Clips are never removed this way.</span></div>
    <div class="row" style="align-items:flex-end"><label class="f" for="archdays" style="flex:0 1 260px">Archive automatically after this many idle days
        <input type="number" id="archdays" min="0" max="3650" value="${days}"></label>
      <button type="button" id="archsave">Save</button><span class="hint" id="archmsg">${days ? `On: checked when wakesmith starts and once a day.` : "Off."} 0 turns it off.</span></div>`;
  const err = m => $("#stoerr").textContent = m || "";
  el.onclick = async e => {
    const b = e.target.closest("button[data-arch]"); if (!b) return;
    const r = rows.find(x => x.name === b.dataset.arch), withClips = !!b.dataset.clips;
    const body = withClips
      ? `This removes ${r.label}'s training features, prepared recordings and spare checkpoints, and its own synthetic clips: ${gb(r.freeable_with_clips)}. Making the clips again takes a long time (speech synthesis). Settings, recordings, results, exported files and the trained model stay.`
      : `This removes ${gb(r.freeable)} of files wakesmith makes again by itself: training features, prepared copies of recordings and spare checkpoints. Settings, recordings, device clips, results, exported files, the trained model and the synthetic clips stay. The next Train rebuilds the features first.`;
    if (!await ask(`Archive ${r.label}?`, body, withClips ? "Archive with clips" : "Archive")) return;
    err(); b.disabled = true;
    try { await api(`/api/projects/${enc(r.name)}/archive`, { method: "POST", body: { clips: withClips } }); storagePanel(); }
    catch (x) { err(x.message); b.disabled = false; }
  };
  $("#archidle").onclick = async () => {
    if (!await ask(`Archive ${idle.length} idle wake word${idle.length === 1 ? "" : "s"}?`,
      `${idle.map(r => r.label).join(", ")}: frees about ${gb(idle.reduce((t, r) => t + r.freeable, 0))}. Clips, settings, recordings, results, exported files and trained models stay.`, "Archive them")) return;
    err(); $("#archidle").disabled = true;
    try { await api("/api/storage/archive-idle", { method: "POST" }); storagePanel(); } catch (x) { err(x.message); $("#archidle").disabled = false; }
  };
  $("#archsave").onclick = async () => {
    err();
    try { await api("/api/storage", { method: "PUT", body: { archive_after_days: +$("#archdays").value || 0 } }); storagePanel(); }
    catch (x) { err(x.message); }
  };
}

async function viewData() {
  nav("#/data");
  const v = $("#view");
  v.innerHTML = `<div><h1>Data &amp; licenses</h1><p class="sub">Everything a model is trained on, and the terms that come with it. wakesmith itself is free for noncommercial use (PolyForm Noncommercial); the models you make carry the terms of their training data.</p></div>
    <section class="panel" aria-labelledby="h-dl" id="dlbox"><h2 id="h-dl">Training data</h2><p class="hint" style="margin:0">checking…</p></section>
    <div class="callout warn">${icon("bang", 18, 2)}<span><b>Personal profile (the default):</b> some of this data allows non-commercial use only (CC BY-NC), so the models you make are for personal use.</span></div>
    <section class="panel" aria-labelledby="h-ds"><h2 id="h-ds">Downloaded data</h2><div class="tablebox" id="assets"><p class="hint">loading…</p></div></section>
    <section class="panel" aria-labelledby="h-lang"><h2 id="h-lang">Languages</h2>
      <label class="row" style="gap:8px"><input type="checkbox" id="explang"><span><b>Offer German for new wake words (experimental)</b>
        <span class="hint" style="display:block">German uses Piper's German voices (downloaded the first time a German word makes its clips, about 0.5 GB; some are personal-use only) and Whisper in German. English stays the default.</span></span></label></section>`;
  api("/api/languages").then(d => { $("#explang").checked = d.experimental; }).catch(() => {});
  $("#explang").onchange = async e => {
    try { await api("/api/languages", { method: "POST", body: { experimental: e.target.checked } }); }
    catch (err) { e.target.checked = !e.target.checked; alert(err.message); }
  };
  const table = async () => {
    try {
      const list = await api("/api/assets");
      const tag = l => /NC/.test(l) ? "warn" : /no license/i.test(l) ? "idle" : "ok";
      $("#assets").innerHTML = `<table style="min-width:680px"><thead><tr><th scope="col">Data</th><th scope="col">Used for</th><th scope="col">Size</th><th scope="col">License</th></tr></thead><tbody>
        ${list.map(a => `<tr><td><b>${esc(a.name)}</b>${a.present ? "" : ` <span class="badge idle">not downloaded</span>`}</td><td style="color:var(--soft)">${esc(a.used_for)}</td>
          <td class="mono">${a.gb.toFixed(2)} GB</td><td><span class="badge ${tag(a.license)}" style="white-space:normal">${esc(a.license)}</span></td></tr>`).join("")}</tbody></table>`;
    } catch (e) { $("#assets").innerHTML = `<p class="err">${esc(e.message)}</p>`; }
  };
  let timer = null;
  const box = async () => {
    const el = $("#dlbox"); if (!el) { clearInterval(timer); return; }
    let d; try { d = await api("/api/assets/download"); } catch (e) { el.innerHTML = `<h2 id="h-dl">Training data</h2><p class="err">${esc(e.message)}</p>`; return; }
    const pct = d.current_size ? Math.min(100, Math.round(100 * d.current_bytes / d.current_size)) : null;
    el.innerHTML = `<h2 id="h-dl">Training data</h2>${d.running
      ? `<p style="margin:0">${icon("spin", 16, 2.5)} Downloading <b>${esc(d.current || "")}</b>${pct != null ? ` · ${pct}%` : ""} · ${d.done.length} done, ${d.missing.length} to go (${d.missing_gb} GB). You can leave this page; it goes on.</p>`
      : d.missing.length ? `<p style="margin:0">${d.missing.length} item${d.missing.length > 1 ? "s" : ""} not downloaded yet (${d.missing_gb} GB). Training needs them.</p>
          ${d.error ? `<div class="callout warn">${icon("bang", 18, 2)}<span>${esc(d.error)}. Press Download again to resume.</span></div>` : ""}
          <div class="row"><button type="button" class="primary" id="dlgo">${icon("down", 16, 2)}Download them</button><span class="hint">or run <code class="mono">wakesmith setup</code> in a terminal</span></div>`
      : `<p style="margin:0">${icon("check", 16, 2.5)} All training data is here.</p>`}`;
    if ($("#dlgo")) $("#dlgo").onclick = async () => { try { await api("/api/assets/download", { method: "POST" }); } catch (e) { alert(e.message); } box(); };
    if (!d.running && timer) { clearInterval(timer); timer = null; table(); }
    if (d.running && !timer) timer = setInterval(box, 3000);
  };
  table(); box();
}

hardware(); route();
</script>
</body>
</html>
