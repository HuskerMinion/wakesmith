[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wakesmith"
version = "0.4.1"
description = "Forge your own wake word: train microWakeWord and openWakeWord models from synthetic speech plus your own recordings, on Intel Arc, NVIDIA or CPU"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "src/wakesmith/tts/vits/LICENSE", "src/wakesmith/web/FONTS-LICENSE.txt"]
requires-python = ">=3.10,<3.13"
authors = [{ name = "HuskerMinion" }]
# torch/torchaudio are not listed: `wakesmith setup` installs the build that matches the hardware
# (XPU, CUDA or CPU wheels come from different indexes). microWakeWord is installed by setup too,
# editable from a pinned clone: its wheel omits the microwakeword.audio package (no __init__.py).
dependencies = [
    "numpy>=2,<3",
    "scipy",
    "soundfile",
    "pyyaml",
    "typer>=0.12",
    "tqdm",
    "onnxruntime>=1.20",
    "onnx>=1.16",  # reads the German voices into PyTorch (tts/onnx_voice.py)
    "tensorflow>=2.18",
    "tensorboard",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# transcribing device clips (wakesmith clips transcribe): Whisper on any torch device; faster-whisper
# (Home Assistant's engine) is used instead when it is installed
whisper = ["transformers>=4.40"]

[project.scripts]
wakesmith = "wakesmith.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wakesmith = ["web/*", "tts/vits/LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["src/wakesmith/tts/vits"]

[tool.ruff.lint.per-file-ignores]
"src/wakesmith/cli.py" = ["B008"]  # typer.Option defaults are the Typer idiom

[tool.pytest.ini_options]
testpaths = ["tests"]
